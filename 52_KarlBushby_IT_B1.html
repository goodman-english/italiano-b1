<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karl Bushby torna a casa dopo 28 anni e 50.000 km a piedi — Goodman Italiano B1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: Calibri, 'Segoe UI', sans-serif;
  background: #0e8388;
  color: #1e2a2e;
}

/* ── TOP BAR ── */
#pb-wrap { position: fixed; top: 0; left: 0; right: 0; height: 5px; background: rgba(255,255,255,0.2); z-index: 200; }
#pb { height: 5px; background: #fb6a5a; transition: width 0.3s; width: 0%; }

#topbar {
  position: fixed; top: 5px; left: 0; right: 0; height: 50px;
  background: #0e8388; z-index: 199;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2vw;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}
#slide-label { color: white; font-size: 1.5vw; font-weight: 700; }
#nav-btns { display: flex; gap: 1vw; }
.nbtn {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
  color: white; padding: 0.4vh 1.5vw; border-radius: 5px;
  cursor: pointer; font-size: 1.3vw; font-family: inherit; font-weight: 600;
}
.nbtn:hover { background: rgba(255,255,255,0.28); }
.nbtn:disabled { opacity: 0.3; cursor: default; }

/* ── VIEWPORT ── */
#viewport {
  position: fixed;
  top: 55px; left: 0; right: 0; bottom: 0;
}

/* ── SLIDES ── */
.slide {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: all; }

/* ════════════════════════════════
   DIVIDER SLIDES
════════════════════════════════ */
.div-slide {
  background: linear-gradient(160deg, #073c40 0%, #0e8388 60%, #0a5458 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 6vw;
  position: relative;
}
.div-slide::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 0.8vh; background: #fb6a5a;
}
.div-icon { font-size: 7vw; line-height: 1; margin-bottom: 2vh; }
.div-num { font-size: 1.2vw; letter-spacing: 0.4vw; text-transform: uppercase; opacity: 0.5; margin-bottom: 1.5vh; font-weight: 700; }
.div-slide h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 5.5vw; line-height: 1.1; margin-bottom: 2.5vh; }
.div-desc { font-size: 1.7vw; opacity: 0.78; max-width: 70vw; line-height: 1.6; margin-bottom: 3.5vh; }
.div-tags { display: flex; flex-wrap: wrap; gap: 1vw; justify-content: center; max-width: 75vw; }
.div-tag {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
  border-radius: 3vw; padding: 0.8vh 2vw; font-size: 1.3vw;
}

/* ════════════════════════════════
   TITLE SLIDE
════════════════════════════════ */
.title-slide {
  background: linear-gradient(150deg, #052b2e 0%, #0e8388 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 4vw;
}
.pod-label { font-size: 1.5vw; letter-spacing: 0.4vw; text-transform: uppercase; color: #fb6a5a; margin-bottom: 3vh; font-weight: 700; }
.title-slide h1 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 6.5vw; line-height: 1.15; width: 90vw; margin-bottom: 3.5vh; }
.red-line { width: 6vw; height: 0.6vh; background: #fb6a5a; margin: 0 auto 3vh; }
.title-meta { display: flex; gap: 4vw; font-size: 1.8vw; opacity: 0.65; flex-wrap: wrap; justify-content: center; }

/* ════════════════════════════════
   CONTENT SLIDE BASE
════════════════════════════════ */
.con-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.slide-head {
  border-left: 0.5vw solid #fb6a5a;
  padding-left: 1.5vw;
  margin-bottom: 2.5vh;
  flex-shrink: 0;
}
.slide-head h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 3.2vw; line-height: 1.15; margin-bottom: 0.4vh; }
.sub { color: #5e7377; font-size: 1.3vw; }

/* ════════════════════════════════
   ANTICIPAZIONE — split slides
════════════════════════════════ */
.single-box {
  flex: 1;
  background: #e6f3f2;
  border-radius: 1vw;
  padding: 3vh 3vw;
  border-top: 0.5vh solid #0e8388;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.single-box h3 { color: #0e8388; font-size: 2.2vw; margin-bottom: 2.5vh; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
.single-box ol { padding-left: 2.5vw; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.single-box ol li { font-size: 2vw; line-height: 1.6; }
.single-box p { font-size: 2vw; line-height: 1.75; flex: 1; display: flex; align-items: center; }

/* ════════════════════════════════
   FIGURE CHIAVE
════════════════════════════════ */
.figures-slide {
  background: #ffeae6;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.figures-slide .slide-head { border-color: #fb6a5a; }
.figures-slide .slide-head h2 { color: #e24e3e; }
.figures-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1.5vh 2vw;
  flex: 1;
}
.figure-card {
  background: white; border-radius: 0.8vw;
  border-left: 0.5vw solid #fb6a5a;
  padding: 1.5vh 2vw;
  display: flex; flex-direction: column; justify-content: center;
}
.figure-card .fname { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 1.9vw; font-weight: 700; color: #0e8388; margin-bottom: 0.8vh; }
.figure-card .fdesc { font-size: 1.35vw; color: #3a4a4e; line-height: 1.5; }

/* ════════════════════════════════
   VOCABULARY
════════════════════════════════ */
.vocab-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 2vh 4vw 2vh;
  overflow: hidden;
}
.vocab-group-label {
  font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase;
  color: #5e7377; font-weight: 700; margin: 1.2vh 0 1vh;
  padding-bottom: 0.6vh; border-bottom: 2px solid #d7e6e4;
  flex-shrink: 0;
}
.vocab-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1.2vh 2vw; flex: 1;
}
.vcard {
  background: white; border-radius: 0.8vw;
  box-shadow: 0 3px 12px rgba(0,0,0,0.09);
  cursor: pointer; perspective: 900px;
}
.vcard-inner {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.45s;
}
.vcard.flipped .vcard-inner { transform: rotateY(180deg); }
.vfront, .vback {
  position: absolute; width: 100%; height: 100%;
  border-radius: 0.8vw; padding: 1.8vh 1.8vw;
  backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
}
.vfront { background: white; }
.vfront .term { font-size: 2vw; font-weight: 700; color: #1e2a2e; line-height: 1.3; flex: 1; display: flex; align-items: center; }
.vfront .vbottom { display: flex; flex-direction: column; gap: 0.6vh; flex-shrink: 0; }
.vfront .rtag { display: inline-block; font-size: 1vw; padding: 0.3vh 0.8vw; border-radius: 2vw; background: #e6f3f2; color: #0e8388; font-weight: 600; align-self: flex-start; }
.vfront .hint { font-size: 1.1vw; color: #9bb0b2; }
.vback { background: #e6f3f2; transform: rotateY(180deg); }
.vback .en { font-size: 1.8vw; font-weight: 700; color: #0e8388; margin-bottom: 1vh; }
.vback .ex { font-size: 1.2vw; font-style: italic; color: #1e2a2e; border-left: 0.3vw solid #fb6a5a; padding-left: 0.8vw; line-height: 1.55; flex: 1; }
.vback .rnote { font-size: 0.95vw; color: #5e7377; margin-top: 0.8vh; flex-shrink: 0; }

/* ════════════════════════════════
   GRAMMAR
════════════════════════════════ */
.gram-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.gram-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #0a6e72;
  flex: 1; display: flex; flex-direction: column;
}
.gram-block h3 { color: #0e8388; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.5vw; margin-bottom: 1.5vh; line-height: 1.2; }
.gram-block .expl { font-size: 1.55vw; color: #3a4a4e; line-height: 1.7; margin-bottom: 2vh; flex-shrink: 0; }
.gram-block ul { list-style: none; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gram-block ul li { background: #e6f3f2; border-radius: 0.6vw; padding: 1.5vh 1.5vw; font-size: 1.45vw; font-style: italic; line-height: 1.6; }
.gram-block ul li strong { font-style: normal; color: #fb6a5a; font-size: 1.5vw; }
.gram-block .snote { font-size: 1.35vw; color: #1E8449; font-weight: 600; margin-top: 2vh; line-height: 1.55; padding: 1.5vh 1.5vw; background: #EAFAF1; border-radius: 0.6vw; flex-shrink: 0; }

/* ════════════════════════════════
   COMPREHENSION
════════════════════════════════ */
.comp-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.comp-label { font-size: 1.2vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 2vh; font-weight: 700; padding-bottom: 1vh; border-bottom: 2px solid #d7e6e4; flex-shrink: 0; }
.qlist { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; }
.qitem { background: white; border-radius: 0.8vw; padding: 2vh 2.5vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 1.5vw; font-size: 1.8vw; line-height: 1.65; flex: 1; align-items: center; }
.qnum { color: #fb6a5a; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.2vw; min-width: 2.5vw; flex-shrink: 0; }

/* ════════════════════════════════
   CULTURAL
════════════════════════════════ */
.cult-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.cult-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #fb6a5a;
  flex: 1; display: flex; flex-direction: column;
}
.cult-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.4vw; margin-bottom: 2vh; line-height: 1.2; flex-shrink: 0; }
.cult-block p { font-size: 1.6vw; line-height: 1.8; flex: 1; }
.en-gl { font-style: italic; color: #5e7377; font-size: 1.2vw; margin-top: 1.5vh; display: block; flex-shrink: 0; }
.cult-hook { margin-top: 2.5vh; padding: 1.5vh 2vw; background: #fff1ef; border-radius: 0.6vw; font-size: 1.45vw; color: #e24e3e; line-height: 1.6; flex-shrink: 0; }

/* ════════════════════════════════
   EXERCISES
════════════════════════════════ */
.ex-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ex-block {
  background: white; border-radius: 1vw;
  padding: 2.5vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  flex: 1; display: flex; flex-direction: column;
}
.ex-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.2vw; margin-bottom: 0.8vh; flex-shrink: 0; }
.ex-instr { font-size: 1.3vw; color: #5e7377; margin-bottom: 1.8vh; line-height: 1.6; flex-shrink: 0; }

/* Gap fill */
.word-bank { display: flex; flex-wrap: wrap; gap: 1vw; margin-bottom: 2vh; padding: 1.5vh 1.5vw; background: #e6f3f2; border-radius: 0.8vw; flex-shrink: 0; }
.dword { background: #0e8388; color: white; padding: 0.8vh 2vw; border-radius: 3vw; font-size: 1.5vw; cursor: pointer; user-select: none; font-weight: 600; }
.dword.sel-w { outline: 0.3vw solid #fb6a5a; outline-offset: 0.2vw; }
.dword.used { opacity: 0.3; cursor: default; }
.gap-sentences { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gap-sentence { font-size: 1.6vw; line-height: 1.4; }
.drop-zone { display: inline-block; min-width: 10vw; border-bottom: 0.2vw solid #0e8388; margin: 0 0.5vw; padding: 0 0.5vw; color: #9bb0b2; font-style: italic; cursor: pointer; vertical-align: bottom; font-size: 1.5vw; }
.drop-zone.filled { color: #1e2a2e; font-style: normal; font-weight: 700; background: #e6f3f2; border-radius: 0.3vw; border-bottom-color: #0a6e72; }
.drop-zone.ok { border-bottom-color: #1E8449; background: #EAFAF1; color: #1E8449; }
.drop-zone.wrong { border-bottom-color: #fb6a5a; background: #ffeae6; color: #fb6a5a; }
.ex-btns { display: flex; gap: 1vw; margin-top: 1.5vh; flex-shrink: 0; }

/* Answer key slide */
.ak-slide {
  background: #EAFAF1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ak-slide .slide-head { border-color: #1E8449; }
.ak-slide .slide-head h2 { color: #1E8449; }
.ak-content { background: white; border-radius: 1vw; padding: 2vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-left: 0.6vw solid #1E8449; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.ak-item { display: flex; gap: 1.5vw; align-items: center; padding: 1.5vh 2vw; background: #F4FDF8; border-radius: 0.6vw; font-size: 1.55vw; line-height: 1.6; }
.ak-num { color: #1E8449; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; min-width: 2.5vw; }
.ak-word { font-weight: 700; color: #1E8449; }
.ak-quote { font-style: italic; color: #5e7377; }

/* Matching */
.match-wrap { flex: 1; display: flex; flex-direction: column; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; margin-bottom: 1.5vh; }
.match-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 1vh; font-weight: 700; }
.mitem { padding: 1.5vh 1.8vw; border-radius: 0.6vw; margin-bottom: 0.8vh; font-size: 1.45vw; cursor: pointer; border: 0.2vw solid transparent; background: #e6f3f2; transition: all 0.18s; line-height: 1.45; }
.mitem:hover { border-color: #0a6e72; }
.mitem.sel { border-color: #0e8388; background: #cde9e7; font-weight: 700; }
.mitem.matched { border-color: #1E8449; background: #EAFAF1; color: #1E8449; cursor: default; font-weight: 600; }
.mitem.bad { border-color: #fb6a5a; background: #ffeae6; }

/* VF */
.vf-list { flex: 1; display: flex; flex-direction: column; gap: 1.2vh; }
.vf-row { display: flex; gap: 1.5vw; align-items: center; padding: 1.8vh 2vw; background: white; border-radius: 0.8vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 1.5vw; line-height: 1.6; flex: 1; }
.vf-btns { display: flex; gap: 0.6vw; flex-shrink: 0; }
.vfb { padding: 0.6vh 1.2vw; border-radius: 2vw; border: 0.2vw solid; font-size: 1.2vw; font-weight: 700; cursor: pointer; background: transparent; font-family: inherit; }
.vfb.V { border-color: #1E8449; color: #1E8449; }
.vfb.F { border-color: #fb6a5a; color: #fb6a5a; }
.vfb.N { border-color: #5e7377; color: #5e7377; }
.vfb.correct { background: #1E8449; color: white; border-color: #1E8449; }
.vfb.incorrect { background: #fb6a5a; color: white; border-color: #fb6a5a; }
.vf-note { font-size: 1.1vw; color: #1E8449; font-style: italic; margin-top: 0.5vh; display: none; }
.vf-note.show { display: block; }

/* Buttons */
.ak-btn { padding: 1vh 2vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; cursor: pointer; font-size: 1.3vw; font-weight: 700; font-family: inherit; flex-shrink: 0; }
.ak-btn:hover { opacity: 0.85; }
.ak-btn.grey { background: #5e7377; }
.answer-key { display: none; margin-top: 1.5vh; padding: 1.5vh 2vw; background: #EAFAF1; border-radius: 0.8vw; border-left: 0.4vw solid #1E8449; font-size: 1.3vw; line-height: 1.9; flex-shrink: 0; }
.answer-key.show { display: block; }

/* ════════════════════════════════
   DISCUSSION
════════════════════════════════ */
.disc-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.disc-card { background: white; border-radius: 1vw; padding: 2.5vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); flex: 1; display: flex; flex-direction: column; }
.disc-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2vh; flex-shrink: 0; }
.disc-dots { display: flex; gap: 0.8vw; }
.disc-dot { width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #e6f3f2; border: 0.2vw solid #0a6e72; cursor: pointer; }
.disc-dot.active { background: #0e8388; }
.disc-dot.done { background: #1E8449; border-color: #1E8449; }
.disc-qnum { font-size: 1.4vw; color: #5e7377; font-weight: 600; }
.disc-q { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; line-height: 1.6; color: #1e2a2e; margin-bottom: 2vh; flex-shrink: 0; }
.disc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; min-height: 0; }
.disc-col { display: flex; flex-direction: column; min-height: 0; }
.disc-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 0.8vh; font-weight: 700; flex-shrink: 0; }
.disc-user-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #e6f3f2; font-size: 1.4vw; line-height: 1.7; border: 0.2vw solid transparent; min-height: 0; overflow-y: auto; }
.disc-user-box.listening { border-color: #fb6a5a; background: #ffeae6; }
.disc-user-box .ph { color: #9bb0b2; font-style: italic; }
.disc-model-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #EAFAF1; font-size: 1.3vw; line-height: 1.8; min-height: 0; overflow-y: auto; }
.disc-model-box.blur .mtext { filter: blur(6px); user-select: none; }
.reveal-btn { display: inline-block; margin-top: 0.8vh; padding: 0.7vh 1.8vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; font-size: 1.2vw; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.mic-row { display: flex; align-items: center; gap: 1.5vw; margin-top: 1.5vh; flex-shrink: 0; }
.mic-btn { width: 5vw; height: 5vw; border-radius: 50%; border: none; background: #fb6a5a; color: white; font-size: 2.2vw; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(192,57,43,0.38); flex-shrink: 0; }
.mic-btn.on { background: #1E8449; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(30,132,73,0.5); } 50% { box-shadow: 0 0 0 1vw rgba(30,132,73,0); } }
.mic-status { font-size: 1.2vw; color: #5e7377; line-height: 1.5; }
.disc-nav { display: flex; gap: 1vw; justify-content: flex-end; margin-top: 1.5vh; flex-shrink: 0; }
.disc-nav-btn { padding: 0.8vh 2.5vw; border-radius: 0.5vw; border: 0.2vw solid #0e8388; background: transparent; color: #0e8388; font-size: 1.3vw; font-weight: 700; cursor: pointer; font-family: inherit; }
.disc-nav-btn:hover { background: #0e8388; color: white; }

 chilometri attraverso quattro continenti. Ringraziando tutti per il sostegno, ha detto: «Non l'ho fatto da solo. È stato uno sforzo globale». Il giorno prima la gente lo aveva già applaudito mentre attraversava, nella nebbia, il famoso Humber Bridge.", "L'idea è nata da un biglietto di compleanno del padre, Keith, a metà degli anni Novanta. Il padre ricordava una discussione tra militari: è possibile camminare da Londra a New York passando per lo stretto di Bering? Bushby ha tracciato una linea sulla mappa e, invece di fermarsi a New York, ha deciso di partire dall'estremità sud del Cile. Si è dato due regole: non usare mai un mezzo di trasporto per avanzare e tornare a casa a piedi.", "Il viaggio doveva durare 12 anni, ma gli ostacoli sono stati moltissimi: giungle, deserti, la tundra ghiacciata e soprattutto la burocrazia. Ha attraversato la pericolosa giungla del Darién Gap, tra Sud e Centro America, ed è finito in prigione per 18 giorni a Panama. Nel 2006, attraversando lo stretto di Bering con un altro avventuriero, è caduto nell'acqua gelata; arrivati in Russia senza permesso, i due sono stati arrestati.", "Per attraversare la Russia ci sono voluti quasi dieci anni, a causa dei visti e del clima. Quando la Russia gli ha negato il visto, nel 2012, Bushby ha protestato camminando da Los Angeles fino all'ambasciata russa a Washington. Più tardi, non potendo passare né dalla Russia né dall'Iran, ha nuotato per 31 giorni nel Mar Caspio. Non è un buon nuotatore: procedeva all'indietro, aiutandosi con un giubbotto e una muta.", "Durante il viaggio lo hanno aiutato tantissimi sconosciuti. «Sono stato accolto dai più poveri tra i poveri», racconta. La gente gli offriva riso e acqua senza chiedere nulla in cambio. Ora il regista tedesco Werner Herzog sta girando un documentario sul suo viaggio, «Walk of Life». E Bushby? Ammette di avere un po' paura: «Devo cercare di rimettermi in piedi nel mondo degli adulti»."], "url": "https://it.euronews.com/2026/11/02/karl-bushby-torna-a-casa-dopo-28-anni-e-50000-km-a-piedi"}, "grammar": [{"label": "Grammatica — Il gerundio con valore causale, temporale e modale", "subtitle": "«…ha detto, aggiungendo che è stato “uno sforzo globale”» · «procedendo all'indietro mentre agitava le braccia» · «Dopo essere stato trasferito in aereo…» · «furono incarcerati per essere entrati illegalmente in Russia»", "title": "Una forma, molti significati: che cosa «dice» il gerundio?", "expl": "Il gerundio è un modo indefinito: non ha persona né numero (camminando, attraversando, avendo camminato). Per questo il suo significato logico non è scritto nella forma: lo capisci dal contesto. È uno strumento tipico della lingua scritta e giornalistica perché permette di condensare due frasi in una. 1) FORMA. Gerundio semplice: -are → -ando (camminare → camminando), -ere/-ire → -endo (prendere → prendendo, partire → partendo). Irregolari dalla vecchia radice: fare → facendo, dire → dicendo, bere → bevendo, porre → ponendo, trarre → traendo, condurre → conducendo. Gerundio composto: avendo / essendo + participio passato (avendo attraversato, essendo partito/a/i/e): con «essendo» il participio concorda con il soggetto. I pronomi atoni si attaccano alla fine: aiutandosi, rimettendomi, dicendoglielo. 2) TEMPO. Il gerundio SEMPLICE indica un fatto CONTEMPORANEO a quello della frase principale (attraversando lo stretto, è caduto = mentre attraversava). Il gerundio COMPOSTO indica un fatto ANTERIORE (avendo ottenuto il visto, è ripartito = dopo che aveva ottenuto). 3) I VALORI PRINCIPALI. (a) TEMPORALE = quando / mentre: «Attraversando lo stretto di Bering, è caduto nell'acqua gelata». (b) CAUSALE = poiché / dato che, spesso in prima posizione, molto frequente con il gerundio composto e con verbi come essere, avere, potere, sapere: «Non potendo passare dalla Russia, ha nuotato nel Mar Caspio»; «Essendo entrati senza permesso, sono stati arrestati». (c) MODALE = in che modo? «procedendo all'indietro», «ha protestato camminando fino all'ambasciata». (d) STRUMENTALE = con quale mezzo? «aiutandosi con un giubbotto». Ci sono anche (e) IPOTETICO = se: «Camminando 20 km al giorno, arrivi in un anno»; (f) CONCESSIVO con PUR = anche se: «Pur non essendo un buon nuotatore, ha attraversato il Caspio». 4) IL GERUNDIO «GIORNALISTICO» (coordinativo). Nei testi di cronaca il gerundio spesso aggiunge semplicemente un secondo fatto, come «e»: «ha detto…, aggiungendo che è stato uno sforzo globale» = «ha detto… e ha aggiunto che…». È diffusissimo dopo i verbi di dire (aggiungendo, sottolineando, spiegando, precisando). Riconoscilo, ma nei tuoi testi non esagerare: tre gerundi di fila rendono la frase pesante. 5) LA REGOLA DEL SOGGETTO. Normalmente il soggetto del gerundio è LO STESSO della frase principale: «Ringraziando tutti, Bushby ha detto…» (chi ringrazia? Bushby). ✘ «Arrivando a Hull, la folla lo ha applaudito» significa che arrivava la folla! ✔ «Quando è arrivato a Hull, la folla lo ha applaudito». Se il soggetto è diverso, va espresso DOPO il gerundio (gerundio assoluto, registro formale): «Essendo chiuse le frontiere, Bushby ha dovuto nuotare». 6) GERUNDIO O INFINITO? Dopo una preposizione l'italiano NON usa il gerundio, ma l'infinito: «senza utilizzare alcun mezzo», «prima di partire», «invece di fermarsi a New York». Per l'anteriorità con «dopo» si usa l'INFINITO PASSATO: «dopo aver ricevuto gli elogi», «dopo essere stato trasferito in aereo», e per la causa «per + infinito passato»: «sono stati incarcerati per essere entrati illegalmente» (= essendo entrati). Queste costruzioni sono sinonimi espliciti del gerundio composto: «Dopo essere riusciti nella traversata, furono incarcerati» ≈ «Essendo riusciti nella traversata…». 7) GERUNDIO E «MENTRE». «Mentre attraversava il ponte» e «attraversando il ponte» sono quasi equivalenti, ma «mentre» + verbo finito permette un soggetto diverso: «La gente lo applaudiva mentre attraversava il ponte» (applaude la gente, attraversa lui) — qui il gerundio NON è possibile. 8) STARE + GERUNDIO. In «Herzog sta girando un documentario» il gerundio forma una perifrasi progressiva (azione in corso): è un uso diverso, non avverbiale. 9) NOTA PER CHI TRADUCE. L'-ing inglese corrisponde al gerundio italiano solo quando ha valore avverbiale. «Walking is good for you» → «Camminare fa bene» (soggetto = infinito); «without using any transport» → «senza usare» (preposizione + infinito); «after crossing» → «dopo aver attraversato»; «a man walking home» → «un uomo che torna a casa a piedi» (relativa, non gerundio); «I saw him walking» → «l'ho visto camminare / che camminava». E all'inverso: il gerundio coordinativo italiano («…, aggiungendo che…») si rende spesso con «adding that…» ma anche con «and added that…».", "examples": [["«“Non l'ho fatto da solo”, ha detto, aggiungendo che è stato “uno sforzo globale”»", " — gerundio coordinativo/giornalistico: = e ha aggiunto (dall'articolo)"], ["«procedendo all'indietro mentre agitava le braccia»", " — gerundio modale: in che modo nuotava (dall'articolo)"], ["«Ha attraversato a nuoto la Manica… per raggiungere di nuovo il Regno Unito»", " — finale: per + infinito, non gerundio (dall'articolo)"], ["«Dopo essere stato trasferito in aereo in un luogo sicuro…»", " — dopo + infinito passato ≈ «essendo stato trasferito» (dall'articolo)"], ["«furono incarcerati … per essere entrati illegalmente in Russia»", " — causale: per + infinito passato ≈ «essendo entrati» (dall'articolo)"], ["«senza utilizzare alcun mezzo di trasporto per avanzare»", " — preposizione + infinito: l'-ing inglese NON diventa gerundio (dall'articolo)"], ["«Non potendo passare né dalla Russia né dall'Iran, ha nuotato nel Mar Caspio»", " — gerundio causale in prima posizione (lettura)"], ["✘ «Arrivando a Hull, la folla lo ha applaudito» → ✔ «Quando è arrivato a Hull, la folla lo ha applaudito»", " — il gerundio prende il soggetto della principale"]], "snote": "Tre domande: (1) Chi fa l'azione del gerundio? Deve essere il soggetto della principale (se no: «mentre/quando/poiché» + verbo finito). (2) Il fatto è contemporaneo o anteriore? → gerundio semplice o composto (avendo/essendo + participio). (3) C'è una preposizione davanti (senza, dopo, prima di, per)? → infinito, mai gerundio."}], "comprehension": [{"label": "Comprensione", "h2": "Comprensione", "sub": "1–3: fatti dal servizio · 4–6: domande aperte", "compLabel": "📻 Fatti dal servizio (1–3)  ·  💭 Domande aperte (4–6)", "questions": [["1.", "Chi è Karl Bushby e che cosa ha fatto?", "È un avventuriero britannico, un ex paracadutista. Ha fatto un viaggio di 50.000 chilometri a piedi, che è durato 28 anni."], ["2.", "Da dove è partito e dove è arrivato?", "È partito dal Cile, ha attraversato quattro continenti ed è tornato a casa, a Hull, in Inghilterra."], ["3.", "Come lo hanno accolto al suo arrivo?", "Lo ha accolto una folla di quasi mille persone, che lo ha applaudito."], ["4.", "Bushby si è dato una regola: niente mezzi di trasporto. Secondo te, è una regola coraggiosa o un po' folle? Perché?", "Secondo me è tutte e due le cose. È coraggiosa perché richiede una forza incredibile, ma è anche un po' folle: ha passato quasi trent'anni lontano dalla famiglia."], ["5.", "Dopo 28 anni di viaggio, che cosa può essere difficile nel ritorno a una vita «normale»?", "Forse tutto: avere una casa, un lavoro, fare la spesa. Il mondo è cambiato molto, la tecnologia per esempio, e anche le persone che conosceva sono cambiate."], ["6.", "Ti è mai successo di ricevere aiuto da uno sconosciuto, in viaggio o nella tua città? Racconta.", "Sì, una volta in Portogallo ho perso il treno di notte. Un signore anziano mi ha accompagnato alla stazione degli autobus e mi ha offerto un caffè, senza chiedere niente in cambio."]]}], "gapfill": {"heading": "Completa le frasi in base al servizio!", "words": ["piedi", "anni", "Cile", "folla", "continenti"], "sents": [{"pre": "1.  Karl Bushby ha fatto un viaggio di 50.000 chilometri a", "blank": "piedi", "post": "."}, {"pre": "2.  Il viaggio è durato 28", "blank": "anni", "post": "."}, {"pre": "3.  È partito dal", "blank": "Cile", "post": ", in Sud America."}, {"pre": "4.  Ha attraversato quattro", "blank": "continenti", "post": "senza usare mezzi di trasporto."}, {"pre": "5.  A Hull lo ha applaudito una", "blank": "folla", "post": "di quasi mille persone."}], "answers": [["1.", "piedi", "«a piedi» = on foot; ≠ «in piedi» = standing"], ["2.", "anni", "«durare» + periodo, senza preposizione: «è durato 28 anni»"], ["3.", "Cile", "«il Cile»: con «da» → «dal Cile»; i nomi di Paese hanno l'articolo"], ["4.", "continenti", "maschile plurale: «il continente / i continenti»"], ["5.", "folla", "femminile singolare, collettivo: «una folla di persone» + verbo al singolare"]]}, "verofalso": {"items": [{"s": "Karl Bushby è un ex paracadutista britannico.", "a": "V", "note": ""}, {"s": "Il viaggio è durato 18 anni.", "a": "F", "note": "È durato 28 anni."}, {"s": "Bushby è partito dal Cile.", "a": "V", "note": ""}, {"s": "Ha usato l'aereo per attraversare gli oceani.", "a": "F", "note": "Non ha usato mezzi di trasporto per avanzare."}, {"s": "A Hull lo ha applaudito una folla di quasi mille persone.", "a": "V", "note": ""}, {"s": "Bushby ha già deciso quale sarà il suo prossimo viaggio.", "a": "N", "note": "Il servizio non parla di nuovi viaggi."}], "key_html": "<b>1.</b> Vero &nbsp; <b>2.</b> Falso (28 anni) &nbsp; <b>3.</b> Vero &nbsp; <b>4.</b> Falso (nessun mezzo di trasporto) &nbsp; <b>5.</b> Vero &nbsp; <b>6.</b> Non detto"}, "discussion": [{"q": "Preferisci viaggiare lentamente (a piedi, in bicicletta, in treno) o arrivare il più presto possibile? Perché?", "m": "Preferisco viaggiare lentamente, soprattutto in treno. Guardando dal finestrino vedo come cambia il paesaggio, e posso leggere o lavorare. In aereo arrivo presto, ma non ho la sensazione di aver fatto un viaggio."}, {"q": "Bushby dice: «Non l'ho fatto da solo». Pensa a un tuo grande risultato (uno studio, un lavoro, un trasloco). Chi ti ha aiutato e come?", "m": "Quando ho finito il mio primo grande lavoro di traduzione, un libro di trecento pagine, mi ha aiutato molto mia moglie: leggeva i capitoli e mi diceva dove il testo non era naturale. Senza di lei avrei fatto molti più errori."}, {"q": "Racconta un viaggio difficile che hai fatto. Usa almeno tre gerundi con valori diversi (quando? perché? come?), per esempio «arrivando…», «non sapendo…», «camminando…».", "m": "Anni fa sono andato in Scozia in bicicletta. Arrivando a Inverness, ho trovato una pioggia terribile. Non conoscendo la zona, ho sbagliato strada due volte. Alla fine ho raggiunto l'ostello spingendo la bici, completamente bagnato, ma felice."}], "homework": [{"label": "Compiti — Scrittura", "bgCls": "red", "blockCls": "red-b", "h3color": "#E24E3E", "h3text": "✍ Una notizia di viaggio (80–100 parole)", "bodyHTML": "Scrivi una breve notizia, nello stile di Euronews, su un viaggio straordinario (vero o inventato): chi è partito, da dove, come ha viaggiato, quali ostacoli ha incontrato e come è stato accolto all'arrivo.<br><br>Usa almeno <b>cinque gerundi</b> con valori diversi: <b>temporale</b> (<i>attraversando…</i>), <b>causale</b> (<i>non avendo il visto…</i>), <b>modale</b> (<i>camminando, nuotando…</i>), un <b>gerundio composto</b> (<i>essendo partito…</i>) e un gerundio <b>«giornalistico»</b> dopo un verbo di dire (<i>ha detto…, aggiungendo che…</i>). Usa anche <b>dopo + infinito passato</b> e <b>senza + infinito</b>.<br><br>Usa almeno <b>cinque parole</b> della lezione (per esempio: <i>a piedi, percorrere, l'ostacolo, accogliere, la folla, in cambio</i>).", "chips": ["80–100 parole", "5 parole nuove", "il gerundio"]}], "grammar_practice": [{"title": "Che valore ha il gerundio?", "instr": "Le frasi sono adattate dall'articolo. Indica il valore del gerundio in MAIUSCOLO: (a) temporale, (b) causale, (c) modale/strumentale, (d) coordinativo («giornalistico»), (e) concessivo, (f) ipotetico. Poi riscrivi la frase con una forma esplicita (quando, poiché, e, anche se, se…).", "items": ["1.  «Non l'ho fatto da solo», ha detto, AGGIUNGENDO che è stato uno sforzo globale.", "2.  ATTRAVERSANDO lo stretto di Bering, è caduto nell'acqua gelata.", "3.  NON POTENDO passare dalla Russia né dall'Iran, ha nuotato nel Mar Caspio.", "4.  Nuotava PROCEDENDO all'indietro e AIUTANDOSI con un giubbotto.", "5.  Pur NON ESSENDO un buon nuotatore, ha attraversato il Caspio.", "6.  CAMMINANDO venti chilometri al giorno, si possono fare più di 7.000 km in un anno.", "7.  ESSENDO ENTRATI in Russia senza permesso, i due avventurieri sono stati arrestati.", "8.  Ha protestato contro la decisione CAMMINANDO fino all'ambasciata russa."], "answers": ["1.  (d) … ha detto e ha aggiunto che è stato uno sforzo globale.", "2.  (a) Mentre attraversava lo stretto di Bering, è caduto…", "3.  (b) Poiché non poteva passare dalla Russia né dall'Iran, ha nuotato…", "4.  (c) modale + strumentale: nuotava all'indietro, con l'aiuto di un giubbotto.", "5.  (e) Anche se non è un buon nuotatore, ha attraversato il Caspio.", "6.  (f) Se si camminano venti chilometri al giorno, si possono fare…", "7.  (b, anteriore) Poiché erano entrati in Russia senza permesso, sono stati arrestati.", "8.  (c) In che modo ha protestato? Camminando fino all'ambasciata."]}, {"title": "Dalla frase esplicita al gerundio (o all'infinito)", "instr": "Trasforma la frase subordinata esplicita (poiché, mentre, dopo che, siccome, e, ma…) con un gerundio semplice o composto. ATTENZIONE: in due frasi il gerundio non è possibile (soggetto diverso o preposizione): scrivi perché e lascia una forma corretta.", "items": ["1.  Poiché aveva ottenuto il visto, Bushby è ripartito verso Ovest.", "2.  Mentre camminava nella steppa, ha incontrato venti fortissimi.", "3.  Dopo che era arrivato in Francia, ha attraversato la Manica a nuoto.", "4.  Poiché era stato fermato dalla polizia, ha perso molte settimane.", "5.  Mentre Bushby attraversava il ponte, la gente lo applaudiva.", "6.  Ha ringraziato tutti e ha detto che non ce l'avrebbe fatta da solo.", "7.  È partito ma non ha usato nessun mezzo di trasporto.", "8.  Siccome non conosceva la lingua, chiedeva aiuto a gesti."], "answers": ["1.  Avendo ottenuto il visto, … (gerundio composto: anteriore)", "2.  Camminando nella steppa, … (temporale, stesso soggetto)", "3.  Essendo arrivato in Francia, … (oppure: Dopo essere arrivato in Francia, …)", "4.  Essendo stato fermato dalla polizia, … (composto passivo)", "5.  Impossibile con il gerundio semplice: soggetti diversi (Bushby / la gente). Resta «Mentre Bushby attraversava…» (formale: «Attraversando Bushby il ponte, …», gerundio assoluto, raro).", "6.  Ha ringraziato tutti, dicendo che non ce l'avrebbe fatta da solo. (coordinativo)", "7.  Impossibile «senza usando»: dopo una preposizione serve l'infinito → «È partito senza usare nessun mezzo di trasporto».", "8.  Non conoscendo la lingua, chiedeva aiuto a gesti. (causale)"]}, {"title": "-ing inglese: gerundio, infinito o relativa?", "instr": "Traduci la parte in inglese scegliendo tra le tre soluzioni. Indica la regola in poche parole.", "items": ["1.  Walking is good for your health. → (Camminando / Camminare / Che cammina) fa bene alla salute.", "2.  He crossed Europe without using a car. → Ha attraversato l'Europa senza (usando / usare / aver usato) la macchina.", "3.  After crossing the Channel, he reached England. → Dopo (attraversando / aver attraversato / attraversare) la Manica, è arrivato in Inghilterra.", "4.  Thanking the crowd, he smiled. → (Ringraziando / Ringraziare / Che ringraziava) la folla, ha sorriso.", "5.  A man walking from Chile to England. → Un uomo (camminando / camminare / che cammina) dal Cile all'Inghilterra.", "6.  Not having a visa, he had to wait. → (Non avendo / Non avere / Senza avendo) il visto, ha dovuto aspettare.", "7.  Herzog is making a documentary. → Herzog (sta realizzando / realizzando / è realizzare) un documentario.", "8.  He said it was hard, adding that he was happy. → Ha detto che è stato difficile, (aggiungere / aggiungendo / che aggiunge) di essere felice."], "answers": ["1.  Camminare — soggetto della frase: infinito", "2.  usare — dopo una preposizione: infinito", "3.  aver attraversato — dopo + infinito passato (anteriorità)", "4.  Ringraziando — gerundio modale/temporale, stesso soggetto", "5.  che cammina — valore aggettivale: relativa, non gerundio", "6.  Non avendo — gerundio causale", "7.  sta realizzando — stare + gerundio: azione in corso", "8.  aggiungendo — gerundio coordinativo dopo un verbo di dire"]}]};

function build() {
  const D = SPEC.dividers || {};
  makeTitle(SPEC.title_slide || {});

  makeDivider(D.warmup);
  makeQuestionsSlide(UI.warmupLabel, UI.warmupH2, UI.warmupSub, UI.warmupBox, SPEC.warmup.questions);

  if (SPEC.figures) makeFiguresSlide(SPEC.figures);

  makeDivider(D.vocab);
  const per = 2; // rule: 8 cards per slide (2 groups × 4)
  for (let i = 0; i < VOCAB.length; i += per) {
    makeVocabSlide('Parole chiave — ' + (Math.floor(i/per) + 1) + '/' + Math.ceil(VOCAB.length/per), VOCAB.slice(i, i + per));
  }

  if (SPEC.video && SPEC.video.parts && SPEC.video.parts.length) {
    makeDivider(D.video);

    SPEC.video.parts.forEach((p, i) => makeVideoPartSlide(p, i, SPEC.video.parts.length, vid));
  }

  if (SPEC.reading) { makeDivider(D.reading); makeReadingSlide(SPEC.reading); }

  if (SPEC.grammar && SPEC.grammar.length) { makeDivider(D.grammar); SPEC.grammar.forEach(makeGramSlide); }

  makeDivider(D.comprehension);
  (SPEC.comprehension || []).forEach(makeCompSlide);

  makeDivider(D.exercises);
  if (SPEC.gapfill) { makeGapSlide(SPEC.gapfill); makeGapAnswerSlide(SPEC.gapfill); }
  if (SPEC.match) makeMatchSlide(SPEC.match);
  if (SPEC.verofalso) makeVFSlide(SPEC.verofalso);

  makeDivider(D.discussion);
  makeDiscSlide();

  if (SPEC.homework && SPEC.homework.length) { makeDivider(D.homework); SPEC.homework.forEach(makeHWSlide); }
}

function go(d) {
  SLIDES[cur].el.classList.remove('active');
  cur = Math.max(0, Math.min(TOTAL - 1, cur + d));
  SLIDES[cur].el.classList.add('active'); SLIDES[cur].el.scrollTop = 0; updateNav();
  if (cur === DISC_IDX) initMicPermission();
}
function updateNav() {
  document.getElementById('slide-label').textContent = (cur+1) + ' / ' + TOTAL + ' — ' + SLIDES[cur].label;
  document.getElementById('pb').style.width = ((cur+1)/TOTAL*100) + '%';
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === TOTAL-1;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);

let selWord = null;
function wireGap() {
  const wb = document.getElementById('wb'); const gs = document.getElementById('gap-sents'); if (!wb || !gs) return;
  [...GAP_WORDS].sort(()=>Math.random()-0.5).forEach(w => {
    const d = el('div','dword', w); d.dataset.w = w;
    d.onclick = () => { if (d.classList.contains('used')) return; document.querySelectorAll('.dword').forEach(x=>x.classList.remove('sel-w')); d.classList.add('sel-w'); selWord = w; };
    wb.appendChild(d);
  });
  GAP_SENTS.forEach(s => { const d = el('div','gap-sentence'); d.innerHTML = s.pre + ' <span class="drop-zone" data-blank="'+s.blank+'" onclick="fillZone(this)">_ _ _ _ _</span> ' + s.post; gs.appendChild(d); });
}
function fillZone(z) {
  if (!selWord || z.classList.contains('ok')) return;
  document.querySelectorAll('.drop-zone').forEach(oz=>{ if(oz!==z && oz.dataset.filled===selWord){oz.textContent='_ _ _ _ _';oz.classList.remove('filled','ok','wrong');oz.dataset.filled='';} });
  z.textContent = selWord; z.classList.add('filled'); z.dataset.filled = selWord;
  document.querySelectorAll('.dword').forEach(d=>d.classList.remove('sel-w')); selWord = null;
}
function checkGap() { document.querySelectorAll('.drop-zone').forEach(z=>{ z.classList.remove('ok','wrong'); if(z.dataset.filled===z.dataset.blank) z.classList.add('ok'); else if(z.dataset.filled) z.classList.add('wrong'); }); }
function resetGap() { document.querySelectorAll('.drop-zone').forEach(z=>{z.textContent='_ _ _ _ _';z.classList.remove('filled','ok','wrong');z.dataset.filled='';}); document.querySelectorAll('.dword').forEach(d=>d.classList.remove('used','sel-w')); selWord = null; }

// ── MATCHING ─────────────────────────────────────────────────────
let selTerm = null;
function wireMatch() {
  const tc = document.getElementById('mterms'), dc = document.getElementById('mdefs'); if (!tc || !dc) return;
  const shuffled = [...MATCH].sort(()=>Math.random()-0.5);
  MATCH.forEach((m,i)=>{ const e2 = el('div','mitem', m.t); e2.dataset.pair = i; e2.dataset.side='t';
    e2.onclick = () => { if (e2.classList.contains('matched')) return; document.querySelectorAll('.mitem[data-side="t"]').forEach(x=>x.classList.remove('sel')); e2.classList.add('sel'); selTerm = e2; };
    tc.appendChild(e2); });
  shuffled.forEach(m=>{ const oi = MATCH.findIndex(x=>x.d===m.d); const e2 = el('div','mitem', m.d); e2.dataset.pair = oi; e2.dataset.side='d';
    e2.onclick = () => { if (!selTerm || e2.classList.contains('matched')) return;
      if (selTerm.dataset.pair === e2.dataset.pair) { selTerm.classList.remove('sel'); selTerm.classList.add('matched'); e2.classList.add('matched'); selTerm = null; }
      else { e2.classList.add('bad'); setTimeout(()=>e2.classList.remove('bad'),500); const st = selTerm; selTerm = null; st.classList.add('bad'); setTimeout(()=>st.classList.remove('bad','sel'),500); } };
    dc.appendChild(e2); });
}

// ── VERO / FALSO / NON DETTO ──────────────────────────────────
function wireVF() {
  const root = document.getElementById('vf-root'); if (!root) return;
  VF.forEach((item,i)=>{
    const row = el('div','vf-row'); const btns = el('div','vf-btns');
    UI.vfBtns.forEach(([cls,val])=>{ const b = el('button','vfb '+cls, val); b.onclick = () => checkVF(b, cls, item.a, i); btns.appendChild(b); });
    const body = document.createElement('div'); body.style.flex='1';
    body.appendChild(el('div','', String(i+1)+'. '+item.s));
    if (item.note) { const n = el('div','vf-note','→ '+item.note); n.id='vfn'+i; body.appendChild(n); }
    ap(row, btns, body); root.appendChild(row);
  });
}
function checkVF(btn, chosen, correct, idx) {
  btn.closest('.vf-row').querySelectorAll('.vfb').forEach(b=>b.classList.remove('correct','incorrect'));
  if (chosen===correct) btn.classList.add('correct');
  else { btn.classList.add('incorrect'); const n=document.getElementById('vfn'+idx); if(n) n.classList.add('show'); }
}

// ── DISCUSSION + MIC ─────────────────────────────────────────────
let dIdx=0, recog=null, recording=false, micOK=false, micStream=null;
function wireDisc() {
  const dots = document.getElementById('ddots'); if (!dots) return;
  DISC.forEach((_,i)=>{ const d = el('div','disc-dot'+(i===0?' active':'')); d.onclick = () => gotoDisc(i); dots.appendChild(d); });
  loadDisc();
}
function loadDisc() {
  const dq = document.getElementById('dq'); if (!dq) return;
  dq.textContent = DISC[dIdx].q;
  document.getElementById('dqnum').textContent = (dIdx+1) + '. ' + UI.question + UI.ofN + DISC.length;
  document.getElementById('dmtext').textContent = DISC[dIdx].m;
  document.getElementById('dmbox').classList.add('blur');
  if (!recording) { const ub = document.getElementById('dubox'); ub.innerHTML=''; ub.appendChild(el('span','ph', UI.micPh)); ub.classList.remove('listening'); }
  document.querySelectorAll('.disc-dot').forEach((d,i)=>d.classList.toggle('active', i===dIdx));
  const pb = document.getElementById('dprev'), nb = document.getElementById('dnext');
  if (pb) pb.disabled = dIdx === 0;
  if (nb) { const last = dIdx >= DISC.length - 1; nb.textContent = last ? UI.nextSlide : UI.next; nb.classList.toggle('to-slide', last); }
}
function dNav(d) { document.querySelectorAll('.disc-dot')[dIdx].classList.add('done'); dIdx = Math.max(0, Math.min(DISC.length-1, dIdx+d)); loadDisc(); }
function gotoDisc(i){ dIdx=i; loadDisc(); }
function revealModel(){ document.getElementById('dmbox').classList.toggle('blur'); }
function initMicPermission() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; return; }
  if (micOK && micStream && micStream.active) return;
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => { micStream = stream; micOK = true; const st = document.getElementById('micstat'); if (st) st.textContent = UI.micReady; })
      .catch(e => { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; } });
  }
}
function toggleMic(){ recording ? stopMic() : startMic(); }
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  recog = new SR(); recog.lang='it-IT'; recog.continuous=true; recog.interimResults=true;
  const box = document.getElementById('dubox'); box.innerHTML=''; box.classList.add('listening');
  let final='';
  recog.onresult = e => { let interim=''; for (let i=e.resultIndex; i<e.results.length; i++) { if (e.results[i].isFinal) final += e.results[i][0].transcript + ' '; else interim += e.results[i][0].transcript; } box.textContent = final + interim; micOK = true; };
  recog.onerror = e => { if (e.error!=='no-speech') stopMic(); };
  recog.onend = () => { if (recording) recog.start(); };
  recog.start(); recording = true;
  document.getElementById('micbtn').classList.add('on'); document.getElementById('micbtn').textContent = '⏹';
  document.getElementById('micstat').textContent = UI.micRec;
}
function stopMic() {
  if (recog) { recog.stop(); recog=null; } recording=false;
  document.getElementById('micbtn').classList.remove('on'); document.getElementById('micbtn').textContent = '🎤';
  document.getElementById('micstat').textContent = UI.micPause; document.getElementById('dubox').classList.remove('listening');
}
function toggleAK(id){ document.getElementById(id).classList.toggle('show'); }

wireGap(); wireMatch(); wireVF(); wireDisc();

// ── Text-size control ────────────────────────────────────────────
(function(){
  let z = 100;
  const bar = document.createElement('div'); bar.id='tsize';
  bar.innerHTML = '<span>' + UI.tsize + '</span><button id="tsm">A−</button><span id="tsv">100%</span><button id="tsp">A+</button><button id="tsr">⟲</button>';
  const _tb=document.getElementById('topbar'), _nb=document.getElementById('nav-btns');
  if(_tb && _nb) _tb.insertBefore(bar, _nb); else document.body.appendChild(bar);
  function apply(){ document.getElementById('viewport').style.zoom = (z/100); document.getElementById('tsv').textContent = z+'%'; }
  document.getElementById('tsm').onclick = ()=>{ z=Math.max(70,z-10); apply(); };
  document.getElementById('tsp').onclick = ()=>{ z=Math.min(220,z+10); apply(); };
  document.getElementById('tsr').onclick = ()=>{ z=100; apply(); };
})();
</script>
