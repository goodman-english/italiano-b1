<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grecia, stop ai social per i minori di 15 anni — Goodman Italiano B1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: Calibri, 'Segoe UI', sans-serif;
  background: #0e8388;
  color: #1e2a2e;
}

/* ── TOP BAR ── */
#pb-wrap { position: fixed; top: 0; left: 0; right: 0; height: 5px; background: rgba(255,255,255,0.2); z-index: 200; }
#pb { height: 5px; background: #fb6a5a; transition: width 0.3s; width: 0%; }

#topbar {
  position: fixed; top: 5px; left: 0; right: 0; height: 50px;
  background: #0e8388; z-index: 199;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2vw;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}
#slide-label { color: white; font-size: 1.5vw; font-weight: 700; }
#nav-btns { display: flex; gap: 1vw; }
.nbtn {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
  color: white; padding: 0.4vh 1.5vw; border-radius: 5px;
  cursor: pointer; font-size: 1.3vw; font-family: inherit; font-weight: 600;
}
.nbtn:hover { background: rgba(255,255,255,0.28); }
.nbtn:disabled { opacity: 0.3; cursor: default; }

/* ── VIEWPORT ── */
#viewport {
  position: fixed;
  top: 55px; left: 0; right: 0; bottom: 0;
}

/* ── SLIDES ── */
.slide {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: all; }

/* ════════════════════════════════
   DIVIDER SLIDES
════════════════════════════════ */
.div-slide {
  background: linear-gradient(160deg, #073c40 0%, #0e8388 60%, #0a5458 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 6vw;
  position: relative;
}
.div-slide::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 0.8vh; background: #fb6a5a;
}
.div-icon { font-size: 7vw; line-height: 1; margin-bottom: 2vh; }
.div-num { font-size: 1.2vw; letter-spacing: 0.4vw; text-transform: uppercase; opacity: 0.5; margin-bottom: 1.5vh; font-weight: 700; }
.div-slide h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 5.5vw; line-height: 1.1; margin-bottom: 2.5vh; }
.div-desc { font-size: 1.7vw; opacity: 0.78; max-width: 70vw; line-height: 1.6; margin-bottom: 3.5vh; }
.div-tags { display: flex; flex-wrap: wrap; gap: 1vw; justify-content: center; max-width: 75vw; }
.div-tag {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
  border-radius: 3vw; padding: 0.8vh 2vw; font-size: 1.3vw;
}

/* ════════════════════════════════
   TITLE SLIDE
════════════════════════════════ */
.title-slide {
  background: linear-gradient(150deg, #052b2e 0%, #0e8388 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 4vw;
}
.pod-label { font-size: 1.5vw; letter-spacing: 0.4vw; text-transform: uppercase; color: #fb6a5a; margin-bottom: 3vh; font-weight: 700; }
.title-slide h1 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 6.5vw; line-height: 1.15; width: 90vw; margin-bottom: 3.5vh; }
.red-line { width: 6vw; height: 0.6vh; background: #fb6a5a; margin: 0 auto 3vh; }
.title-meta { display: flex; gap: 4vw; font-size: 1.8vw; opacity: 0.65; flex-wrap: wrap; justify-content: center; }

/* ════════════════════════════════
   CONTENT SLIDE BASE
════════════════════════════════ */
.con-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.slide-head {
  border-left: 0.5vw solid #fb6a5a;
  padding-left: 1.5vw;
  margin-bottom: 2.5vh;
  flex-shrink: 0;
}
.slide-head h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 3.2vw; line-height: 1.15; margin-bottom: 0.4vh; }
.sub { color: #5e7377; font-size: 1.3vw; }

/* ════════════════════════════════
   ANTICIPAZIONE — split slides
════════════════════════════════ */
.single-box {
  flex: 1;
  background: #e6f3f2;
  border-radius: 1vw;
  padding: 3vh 3vw;
  border-top: 0.5vh solid #0e8388;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.single-box h3 { color: #0e8388; font-size: 2.2vw; margin-bottom: 2.5vh; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
.single-box ol { padding-left: 2.5vw; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.single-box ol li { font-size: 2vw; line-height: 1.6; }
.single-box p { font-size: 2vw; line-height: 1.75; flex: 1; display: flex; align-items: center; }

/* ════════════════════════════════
   FIGURE CHIAVE
════════════════════════════════ */
.figures-slide {
  background: #ffeae6;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.figures-slide .slide-head { border-color: #fb6a5a; }
.figures-slide .slide-head h2 { color: #e24e3e; }
.figures-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1.5vh 2vw;
  flex: 1;
}
.figure-card {
  background: white; border-radius: 0.8vw;
  border-left: 0.5vw solid #fb6a5a;
  padding: 1.5vh 2vw;
  display: flex; flex-direction: column; justify-content: center;
}
.figure-card .fname { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 1.9vw; font-weight: 700; color: #0e8388; margin-bottom: 0.8vh; }
.figure-card .fdesc { font-size: 1.35vw; color: #3a4a4e; line-height: 1.5; }

/* ════════════════════════════════
   VOCABULARY
════════════════════════════════ */
.vocab-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 2vh 4vw 2vh;
  overflow: hidden;
}
.vocab-group-label {
  font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase;
  color: #5e7377; font-weight: 700; margin: 1.2vh 0 1vh;
  padding-bottom: 0.6vh; border-bottom: 2px solid #d7e6e4;
  flex-shrink: 0;
}
.vocab-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1.2vh 2vw; flex: 1;
}
.vcard {
  background: white; border-radius: 0.8vw;
  box-shadow: 0 3px 12px rgba(0,0,0,0.09);
  cursor: pointer; perspective: 900px;
}
.vcard-inner {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.45s;
}
.vcard.flipped .vcard-inner { transform: rotateY(180deg); }
.vfront, .vback {
  position: absolute; width: 100%; height: 100%;
  border-radius: 0.8vw; padding: 1.8vh 1.8vw;
  backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
}
.vfront { background: white; }
.vfront .term { font-size: 2vw; font-weight: 700; color: #1e2a2e; line-height: 1.3; flex: 1; display: flex; align-items: center; }
.vfront .vbottom { display: flex; flex-direction: column; gap: 0.6vh; flex-shrink: 0; }
.vfront .rtag { display: inline-block; font-size: 1vw; padding: 0.3vh 0.8vw; border-radius: 2vw; background: #e6f3f2; color: #0e8388; font-weight: 600; align-self: flex-start; }
.vfront .hint { font-size: 1.1vw; color: #9bb0b2; }
.vback { background: #e6f3f2; transform: rotateY(180deg); }
.vback .en { font-size: 1.8vw; font-weight: 700; color: #0e8388; margin-bottom: 1vh; }
.vback .ex { font-size: 1.2vw; font-style: italic; color: #1e2a2e; border-left: 0.3vw solid #fb6a5a; padding-left: 0.8vw; line-height: 1.55; flex: 1; }
.vback .rnote { font-size: 0.95vw; color: #5e7377; margin-top: 0.8vh; flex-shrink: 0; }

/* ════════════════════════════════
   GRAMMAR
════════════════════════════════ */
.gram-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.gram-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #0a6e72;
  flex: 1; display: flex; flex-direction: column;
}
.gram-block h3 { color: #0e8388; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.5vw; margin-bottom: 1.5vh; line-height: 1.2; }
.gram-block .expl { font-size: 1.55vw; color: #3a4a4e; line-height: 1.7; margin-bottom: 2vh; flex-shrink: 0; }
.gram-block ul { list-style: none; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gram-block ul li { background: #e6f3f2; border-radius: 0.6vw; padding: 1.5vh 1.5vw; font-size: 1.45vw; font-style: italic; line-height: 1.6; }
.gram-block ul li strong { font-style: normal; color: #fb6a5a; font-size: 1.5vw; }
.gram-block .snote { font-size: 1.35vw; color: #1E8449; font-weight: 600; margin-top: 2vh; line-height: 1.55; padding: 1.5vh 1.5vw; background: #EAFAF1; border-radius: 0.6vw; flex-shrink: 0; }

/* ════════════════════════════════
   COMPREHENSION
════════════════════════════════ */
.comp-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.comp-label { font-size: 1.2vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 2vh; font-weight: 700; padding-bottom: 1vh; border-bottom: 2px solid #d7e6e4; flex-shrink: 0; }
.qlist { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; }
.qitem { background: white; border-radius: 0.8vw; padding: 2vh 2.5vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 1.5vw; font-size: 1.8vw; line-height: 1.65; flex: 1; align-items: center; }
.qnum { color: #fb6a5a; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.2vw; min-width: 2.5vw; flex-shrink: 0; }

/* ════════════════════════════════
   CULTURAL
════════════════════════════════ */
.cult-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.cult-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #fb6a5a;
  flex: 1; display: flex; flex-direction: column;
}
.cult-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.4vw; margin-bottom: 2vh; line-height: 1.2; flex-shrink: 0; }
.cult-block p { font-size: 1.6vw; line-height: 1.8; flex: 1; }
.en-gl { font-style: italic; color: #5e7377; font-size: 1.2vw; margin-top: 1.5vh; display: block; flex-shrink: 0; }
.cult-hook { margin-top: 2.5vh; padding: 1.5vh 2vw; background: #fff1ef; border-radius: 0.6vw; font-size: 1.45vw; color: #e24e3e; line-height: 1.6; flex-shrink: 0; }

/* ════════════════════════════════
   EXERCISES
════════════════════════════════ */
.ex-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ex-block {
  background: white; border-radius: 1vw;
  padding: 2.5vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  flex: 1; display: flex; flex-direction: column;
}
.ex-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.2vw; margin-bottom: 0.8vh; flex-shrink: 0; }
.ex-instr { font-size: 1.3vw; color: #5e7377; margin-bottom: 1.8vh; line-height: 1.6; flex-shrink: 0; }

/* Gap fill */
.word-bank { display: flex; flex-wrap: wrap; gap: 1vw; margin-bottom: 2vh; padding: 1.5vh 1.5vw; background: #e6f3f2; border-radius: 0.8vw; flex-shrink: 0; }
.dword { background: #0e8388; color: white; padding: 0.8vh 2vw; border-radius: 3vw; font-size: 1.5vw; cursor: pointer; user-select: none; font-weight: 600; }
.dword.sel-w { outline: 0.3vw solid #fb6a5a; outline-offset: 0.2vw; }
.dword.used { opacity: 0.3; cursor: default; }
.gap-sentences { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gap-sentence { font-size: 1.6vw; line-height: 1.4; }
.drop-zone { display: inline-block; min-width: 10vw; border-bottom: 0.2vw solid #0e8388; margin: 0 0.5vw; padding: 0 0.5vw; color: #9bb0b2; font-style: italic; cursor: pointer; vertical-align: bottom; font-size: 1.5vw; }
.drop-zone.filled { color: #1e2a2e; font-style: normal; font-weight: 700; background: #e6f3f2; border-radius: 0.3vw; border-bottom-color: #0a6e72; }
.drop-zone.ok { border-bottom-color: #1E8449; background: #EAFAF1; color: #1E8449; }
.drop-zone.wrong { border-bottom-color: #fb6a5a; background: #ffeae6; color: #fb6a5a; }
.ex-btns { display: flex; gap: 1vw; margin-top: 1.5vh; flex-shrink: 0; }

/* Answer key slide */
.ak-slide {
  background: #EAFAF1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ak-slide .slide-head { border-color: #1E8449; }
.ak-slide .slide-head h2 { color: #1E8449; }
.ak-content { background: white; border-radius: 1vw; padding: 2vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-left: 0.6vw solid #1E8449; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.ak-item { display: flex; gap: 1.5vw; align-items: center; padding: 1.5vh 2vw; background: #F4FDF8; border-radius: 0.6vw; font-size: 1.55vw; line-height: 1.6; }
.ak-num { color: #1E8449; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; min-width: 2.5vw; }
.ak-word { font-weight: 700; color: #1E8449; }
.ak-quote { font-style: italic; color: #5e7377; }

/* Matching */
.match-wrap { flex: 1; display: flex; flex-direction: column; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; margin-bottom: 1.5vh; }
.match-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 1vh; font-weight: 700; }
.mitem { padding: 1.5vh 1.8vw; border-radius: 0.6vw; margin-bottom: 0.8vh; font-size: 1.45vw; cursor: pointer; border: 0.2vw solid transparent; background: #e6f3f2; transition: all 0.18s; line-height: 1.45; }
.mitem:hover { border-color: #0a6e72; }
.mitem.sel { border-color: #0e8388; background: #cde9e7; font-weight: 700; }
.mitem.matched { border-color: #1E8449; background: #EAFAF1; color: #1E8449; cursor: default; font-weight: 600; }
.mitem.bad { border-color: #fb6a5a; background: #ffeae6; }

/* VF */
.vf-list { flex: 1; display: flex; flex-direction: column; gap: 1.2vh; }
.vf-row { display: flex; gap: 1.5vw; align-items: center; padding: 1.8vh 2vw; background: white; border-radius: 0.8vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 1.5vw; line-height: 1.6; flex: 1; }
.vf-btns { display: flex; gap: 0.6vw; flex-shrink: 0; }
.vfb { padding: 0.6vh 1.2vw; border-radius: 2vw; border: 0.2vw solid; font-size: 1.2vw; font-weight: 700; cursor: pointer; background: transparent; font-family: inherit; }
.vfb.V { border-color: #1E8449; color: #1E8449; }
.vfb.F { border-color: #fb6a5a; color: #fb6a5a; }
.vfb.N { border-color: #5e7377; color: #5e7377; }
.vfb.correct { background: #1E8449; color: white; border-color: #1E8449; }
.vfb.incorrect { background: #fb6a5a; color: white; border-color: #fb6a5a; }
.vf-note { font-size: 1.1vw; color: #1E8449; font-style: italic; margin-top: 0.5vh; display: none; }
.vf-note.show { display: block; }

/* Buttons */
.ak-btn { padding: 1vh 2vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; cursor: pointer; font-size: 1.3vw; font-weight: 700; font-family: inherit; flex-shrink: 0; }
.ak-btn:hover { opacity: 0.85; }
.ak-btn.grey { background: #5e7377; }
.answer-key { display: none; margin-top: 1.5vh; padding: 1.5vh 2vw; background: #EAFAF1; border-radius: 0.8vw; border-left: 0.4vw solid #1E8449; font-size: 1.3vw; line-height: 1.9; flex-shrink: 0; }
.answer-key.show { display: block; }

/* ════════════════════════════════
   DISCUSSION
════════════════════════════════ */
.disc-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.disc-card { background: white; border-radius: 1vw; padding: 2.5vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); flex: 1; display: flex; flex-direction: column; }
.disc-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2vh; flex-shrink: 0; }
.disc-dots { display: flex; gap: 0.8vw; }
.disc-dot { width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #e6f3f2; border: 0.2vw solid #0a6e72; cursor: pointer; }
.disc-dot.active { background: #0e8388; }
.disc-dot.done { background: #1E8449; border-color: #1E8449; }
.disc-qnum { font-size: 1.4vw; color: #5e7377; font-weight: 600; }
.disc-q { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; line-height: 1.6; color: #1e2a2e; margin-bottom: 2vh; flex-shrink: 0; }
.disc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; min-height: 0; }
.disc-col { display: flex; flex-direction: column; min-height: 0; }
.disc-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 0.8vh; font-weight: 700; flex-shrink: 0; }
.disc-user-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #e6f3f2; font-size: 1.4vw; line-height: 1.7; border: 0.2vw solid transparent; min-height: 0; overflow-y: auto; }
.disc-user-box.listening { border-color: #fb6a5a; background: #ffeae6; }
.disc-user-box .ph { color: #9bb0b2; font-style: italic; }
.disc-model-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #EAFAF1; font-size: 1.3vw; line-height: 1.8; min-height: 0; overflow-y: auto; }
.disc-model-box.blur .mtext { filter: blur(6px); user-select: none; }
.reveal-btn { display: inline-block; margin-top: 0.8vh; padding: 0.7vh 1.8vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; font-size: 1.2vw; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.mic-row { display: flex; align-items: center; gap: 1.5vw; margin-top: 1.5vh; flex-shrink: 0; }
.mic-btn { width: 5vw; height: 5vw; border-radius: 50%; border: none; background: #fb6a5a; color: white; font-size: 2.2vw; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(192,57,43,0.38); flex-shrink: 0; }
.mic-btn.on { background: #1E8449; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(30,132,73,0.5); } 50% { box-shadow: 0 0 0 1vw rgba(30,132,73,0); } }
.mic-status { font-size: 1.2vw; color: #5e7377; line-height: 1.5; }
.disc-nav { display: flex; gap: 1vw; justify-content: flex-end; margin-top: 1.5vh; flex-shrink: 0; }
.disc-nav-btn { padding: 0.8vh 2.5vw; border-radius: 0.5vw; border: 0.2vw solid #0e8388; background: transparent; color: #0e8388; font-size: 1.3vw; font-weight: 700; cursor: pointer; font-family: inherit; }
.disc-nav-btn:hover { background: #0e8388; color: white; }

 ai ragazzi che non hanno ancora compiuto 15 anni. Il governo ha presentato un disegno di legge che dovrebbe entrare in vigore il 1º gennaio 2027. La data lascia alle piattaforme il tempo di prepararsi. Il voto in Parlamento è previsto per il 22 ottobre.", "Secondo il governo, i genitori hanno bisogno di aiuto concreto: gli algoritmi dei social cercano di tenere i bambini sempre connessi. La tecnologia, dicono i ministri, deve mettere al centro la persona, e soprattutto la salute e lo sviluppo dei minori.", "Il divieto riguarda servizi come Instagram, TikTok e Facebook. La novità più importante è che la responsabilità passa alle aziende: saranno le piattaforme a dover verificare l'età degli utenti con metodi affidabili. Il divieto, quindi, non deve restare solo sulla carta.", "Come funzionerà la verifica? Lo Stato propone il Kids Wallet e il Gov.gr Wallet, ma le aziende possono scegliere anche altre soluzioni, se rispettano le regole europee. Il sistema usa contrassegni digitali di età: la piattaforma sa soltanto se l'utente ha l'età giusta, senza ricevere il suo nome o altri dati personali.", "Il controllo non sarà solo nazionale: la legge segue il Regolamento europeo sui servizi digitali (DSA). In Grecia se ne occuperà soprattutto l'autorità per le telecomunicazioni, l'EETT, anche dopo la segnalazione di un utente. Atene spera così di contribuire a future regole comuni europee, il cosiddetto EU Kids Act."], "url": "https://it.euronews.com/2026/10/12/grecia-stop-ai-social-per-i-minori-di-15-anni-dal-2027-come-sara-verificata-leta"}, "grammar": [{"label": "Grammatica — La sintassi della cronaca: titoli nominali ed ellissi del verbo", "subtitle": "«Grecia, stop ai social…» · «dal 2027» · «: come sarà verificata l'età» · «Contrassegni digitali di età e tutela dei dati personali»", "title": "«Grecia, stop ai social per i minori di 15 anni dal 2027»: dov'è il verbo?", "expl": "Leggiamo il titolo del servizio: «Grecia, stop ai social per i minori di 15 anni dal 2027: come sarà verificata l'età». Nella prima parte non c'è un verbo coniugato. La frase completa sarebbe: «La Grecia VIETERÀ i social ai minori di 15 anni a partire dal 2027». Il giornalista toglie il verbo e lascia solo le informazioni: CHI, CHE COSA, A CHI, QUANDO. Il lettore ricostruisce il resto. Ecco i meccanismi principali. 1) IL TEMA IN TESTA, CON LA VIRGOLA: «Grecia, …» = «In Grecia…» / «La Grecia…». Il luogo o il protagonista si mette all'inizio, senza articolo, e la virgola sostituisce il verbo e la preposizione: «Roma, chiuso il Colosseo», «Francia, nuovo sciopero dei treni». 2) IL NOME D'AZIONE AL POSTO DEL VERBO: «stop a» = vietare / fermare; «divieto di» = vietare; «via libera a» = approvare; «no a» / «sì a» = rifiutare / accettare; «stretta su» o «giro di vite su» = rendere più severe le regole; «allarme» = c'è un pericolo. Il nome conserva la PREPOSIZIONE che regge il complemento: «stop AI social» (come «dire basta ai social»), «via libera ALLA legge», «stretta SUGLI affitti brevi». 3) IL TEMPO NEL COMPLEMENTO: senza verbo, il tempo grammaticale si ricava dalle date e dagli avverbi: «dal 2027» → futuro; «ieri», «nella notte» → passato; nessuna data → di solito presente o passato prossimo. 4) DUE PUNTI + INTERROGATIVA INDIRETTA: «: come sarà verificata l'età», «Chi controllerà l'applicazione della misura». È una domanda senza punto interrogativo: il titolo PROMETTE una spiegazione (= «vi spieghiamo come…»). Dentro la domanda indiretta il verbo c'è ed è normale (sarà verificata, controllerà). Spesso il servizio in inglese ha la formula «what you need to know»; l'italiano preferisce «cosa sapere», «ecco come», «come funziona». 5) LA COPPIA NOMINALE NEI SOTTOTITOLI: «Contrassegni digitali di età e tutela dei dati personali», «Il piano greco e il futuro EU Kids Act»: due nomi uniti da «e» annunciano l'argomento del paragrafo, come il titolo di un capitolo. La relazione tra i due (contrasto? causa?) la spiega il testo. 6) NOMINALIZZAZIONE ANCHE NEL TESTO: il corpo dell'articolo ha i verbi, ma ama i nomi: «l'entrata in vigore» (= quando entra in vigore), «l'applicazione della misura» (= applicare la misura), «la verifica dell'età» (= verificare l'età). Leggere un titolo vuol dire trasformare di nuovo i nomi in verbi. 7) NOTA PER CHI TRADUCE: l'inglese giornalistico accorcia in modo diverso. Tiene quasi sempre un verbo (al presente, all'infinito per il futuro o al participio): «Greece to ban social media for under-15s from 2027», «Greece bans…». L'italiano preferisce il nome: «Grecia, stop ai social…», «Grecia, divieto dei social…». Tradurre «to ban» con un infinito («Grecia vietare i social») è impossibile in italiano: serve un nome d'azione o una frase completa («La Grecia vieterà…»). Al contrario, «stop a» in un titolo inglese va reso con un verbo: «Greece says no to…», «Greece to ban…».", "examples": [["«Grecia, stop ai social per i minori di 15 anni dal 2027»", " — tema + virgola, nome d'azione «stop a», tempo dato da «dal 2027» (= la Grecia vieterà…)"], ["«…: come sarà verificata l'età»", " — due punti + interrogativa indiretta: il titolo promette una spiegazione"], ["«Chi controllerà l'applicazione della misura»", " — sottotitolo: domanda indiretta senza punto interrogativo (dall'articolo)"], ["«Contrassegni digitali di età e tutela dei dati personali»", " — coppia nominale: annuncia l'argomento del paragrafo (dall'articolo)"], ["«Il limite di età … verrà fissato a 15 anni»", " — sottotitolo con verbo: più chiaro, meno compatto (dall'articolo)"], ["«Ue, via libera al nuovo regolamento»", " — nome d'azione «via libera a» = l'Ue ha approvato…"], ["«Affitti brevi, stretta del Comune»", " — tema + virgola, «stretta» = regole più severe"], ["«l'entrata in vigore fissata per il 1º gennaio 2027»", " — nominalizzazione nel corpo del testo (= la legge entrerà in vigore il…)"]], "snote": "Come si legge un titolo nominale, in quattro passi. (1) Trova il TEMA (di solito prima della virgola): è il soggetto o il luogo. (2) Trova il NOME D'AZIONE (stop, divieto, via libera, no, stretta…) e trasformalo in verbo (vietare, approvare, rifiutare…). (3) Cerca DATE e AVVERBI per scegliere il tempo: futuro, passato o presente. (4) Dopo i DUE PUNTI c'è spesso una domanda indiretta o una citazione: è la promessa del servizio. Ricostruisci: «La Grecia vieterà i social ai minori di 15 anni dal 2027; vi spieghiamo come verrà verificata l'età»."}], "comprehension": [{"label": "Comprensione", "h2": "Comprensione", "sub": "1–3: fatti dal servizio · 4–6: domande aperte", "compLabel": "📻 Fatti dal servizio (1–3)  ·  💭 Domande aperte (4–6)", "questions": [["1.", "Che cosa vuole vietare la Grecia, e a chi?", "Vuole vietare i social network ai ragazzi che non hanno ancora compiuto 15 anni."], ["2.", "Da quando dovrebbe valere la nuova regola?", "Dal 1º gennaio 2027."], ["3.", "Chi dovrà controllare l'età degli utenti?", "Le piattaforme stesse (le aziende come Instagram, TikTok e Facebook), con sistemi affidabili come il Kids Wallet."], ["4.", "Secondo te, 15 anni è l'età giusta per usare i social? Perché?", "Secondo me è un'età ragionevole: a 15 anni un ragazzo capisce meglio i rischi. Però dipende anche dai genitori e da come si usano i social."], ["5.", "Un divieto funziona davvero, o i ragazzi trovano sempre un modo per aggirarlo?", "Credo che molti ragazzi proveranno ad aggirarlo, per esempio con il profilo di un amico più grande. Ma se la verifica è seria, il divieto aiuta almeno i più piccoli."], ["6.", "È giusto che la responsabilità sia delle piattaforme e non dei genitori?", "Secondo me deve essere di tutti e due. Le piattaforme guadagnano con i giovani utenti, quindi devono controllare l'età; i genitori, però, devono parlare con i figli e dare l'esempio."]]}], "gapfill": {"heading": "Completa le frasi in base al servizio!", "words": ["vietare", "15", "2027", "piattaforme", "dati"], "sents": [{"pre": "1.  La Grecia vuole", "blank": "vietare", "post": "i social network ai più giovani."}, {"pre": "2.  Il divieto vale per i ragazzi che non hanno ancora compiuto", "blank": "15", "post": "anni."}, {"pre": "3.  La nuova legge dovrebbe entrare in vigore il 1º gennaio", "blank": "2027", "post": "."}, {"pre": "4.  Saranno le", "blank": "piattaforme", "post": "a dover verificare l'età degli utenti."}, {"pre": "5.  La verifica non deve chiedere troppi", "blank": "dati", "post": "personali."}], "answers": [["1.", "vietare", "nome: «il divieto»"], ["2.", "15", "quindici anni"], ["3.", "2027", "«entrare in vigore» = to come into force"], ["4.", "piattaforme", "Instagram, TikTok, Facebook…"], ["5.", "dati", "«i dati personali» = personal data"]]}, "verofalso": {"items": [{"s": "La Grecia vuole vietare i social ai ragazzi sotto i 15 anni.", "a": "V", "note": ""}, {"s": "La nuova legge vale già da questo mese.", "a": "F", "note": "Dovrebbe entrare in vigore il 1º gennaio 2027."}, {"s": "Il divieto riguarda anche piattaforme come Instagram e TikTok.", "a": "V", "note": ""}, {"s": "Saranno i genitori a dover controllare l'età dei figli.", "a": "F", "note": "La responsabilità passa alle piattaforme."}, {"s": "Per la verifica le piattaforme devono raccogliere tutti i dati dei ragazzi.", "a": "F", "note": "Il sistema deve chiedere solo i dati strettamente necessari."}, {"s": "In Grecia molti ragazzi sono contrari alla nuova legge.", "a": "N", "note": "Il servizio non parla dell'opinione dei ragazzi."}], "key_html": "<b>1.</b> Vero &nbsp; <b>2.</b> Falso (dal 1º gennaio 2027) &nbsp; <b>3.</b> Vero &nbsp; <b>4.</b> Falso (le piattaforme) &nbsp; <b>5.</b> Falso (solo i dati necessari) &nbsp; <b>6.</b> Non detto"}, "discussion": [{"q": "Sei d'accordo con il divieto dei social sotto i 15 anni? Spiega perché.", "m": "Sono abbastanza d'accordo. I social possono creare dipendenza e ansia, e a dodici o tredici anni è difficile difendersi. Però vietare non basta: bisogna anche insegnare ai ragazzi a usarli bene."}, {"q": "Come si potrebbe verificare l'età online senza dare troppi dati personali?", "m": "Si potrebbe usare un'app dello Stato, come il Kids Wallet: l'app dice solo «sì, ha più di 15 anni» e non dà il nome o la data di nascita. Così la piattaforma sa quello che le serve, e niente di più."}, {"q": "Inventa un titolo di giornale senza verbo per una notizia del tuo Paese o della tua città, poi spiegalo con una frase completa.", "m": "«Budapest, stop alle auto in centro la domenica». Significa: a Budapest il Comune ha deciso di vietare le auto nel centro della città la domenica."}], "homework": [{"label": "Compiti — Scrittura", "bgCls": "red", "blockCls": "red-b", "h3color": "#E24E3E", "h3text": "✍ Una notizia in breve (80–100 parole)", "bodyHTML": "Immagina una nuova regola nella tua città, nella tua scuola o nel tuo posto di lavoro (per esempio: niente telefoni in classe, una zona senza auto, un nuovo orario). Scrivi una breve notizia, come un giornalista.<br><br><b>Struttura:</b> un <b>titolo nominale</b> (tema + virgola + nome d'azione: <i>stop a, divieto di, via libera a, sì a, no a</i>), un <b>sottotitolo</b> con i due punti e una domanda indiretta (<i>: come funzionerà…</i>, <i>: chi dovrà…</i>) e un testo di 80–100 parole con frasi complete.<br><br>Usa almeno <b>cinque parole</b> della lezione (per esempio: <i>il divieto, entrare in vigore, il provvedimento, l'obbligo, la segnalazione</i>). Alla fine riscrivi il titolo come frase completa.", "chips": ["80–100 parole", "5 parole nuove", "1 titolo nominale"]}], "grammar_practice": [{"title": "Dal titolo alla frase completa", "instr": "Leggi il titolo e scegli la frase completa giusta. Attenzione al tempo del verbo!", "items": ["1.  Grecia, stop ai social per i minori di 15 anni dal 2027 → (a) La Grecia ha vietato i social nel 2027. (b) La Grecia vieterà i social ai minori di 15 anni dal 2027. (c) La Grecia vieta i social dal 2015.", "2.  Ue, via libera alla nuova direttiva → (a) L'Ue ha approvato la nuova direttiva. (b) L'Ue ha respinto la nuova direttiva. (c) L'Ue discuterà la nuova direttiva.", "3.  Milano, stretta sugli affitti brevi → (a) A Milano gli affitti brevi diventano più economici. (b) Milano rende più severe le regole sugli affitti brevi. (c) A Milano finiscono gli affitti lunghi.", "4.  Scuola, no ai cellulari in classe da settembre → (a) I cellulari in classe erano vietati a settembre. (b) Da settembre i cellulari saranno vietati in classe. (c) A settembre tutti avranno un cellulare.", "5.  Parlamento greco, voto sulla legge il 22 ottobre → (a) Il Parlamento voterà la legge il 22 ottobre. (b) Il Parlamento ha bocciato la legge il 22 ottobre. (c) La legge entra in vigore il 22 ottobre.", "6.  Kids Wallet: come funziona l'app per l'età → (a) Il Kids Wallet non funziona. (b) Vi spieghiamo come funziona l'app per l'età. (c) Chiediamo ai lettori come funziona l'app."], "answers": ["1.  (b) — «stop a» = vietare; «dal 2027» → futuro", "2.  (a) — «via libera a» = approvare", "3.  (b) — «stretta su» = regole più severe", "4.  (b) — «no a» = vietare; «da settembre» → futuro", "5.  (a) — «voto su» = votare; data futura", "6.  (b) — due punti + domanda indiretta = promessa di spiegazione"]}, {"title": "Quale nome d'azione?", "instr": "Completa il titolo con il nome d'azione giusto: stop · via libera · stretta · divieto · allarme · sì. Ogni parola si usa una volta. Attenzione alla preposizione!", "items": ["1.  Grecia, ______ ai social per i minori di 15 anni  (= la Grecia ferma l'accesso ai social)", "2.  Bruxelles, ______ al bilancio 2027  (= il bilancio è stato approvato)", "3.  Atene, ______ sui controlli dell'età online  (= controlli più severi)", "4.  Spiagge, ______ di fumo dal 1º giugno  (= è vietato fumare)", "5.  West Nile, ______ in Europa: casi verso nord  (= c'è un pericolo)", "6.  Referendum, ______ alla riforma con il 60%  (= gli elettori hanno accettato la riforma)"], "answers": ["1.  stop (stop a)", "2.  via libera (via libera a)", "3.  stretta (stretta su)", "4.  divieto (divieto di)", "5.  allarme", "6.  sì (sì a)"]}, {"title": "Riscrivi come titolo nominale", "instr": "Trasforma la frase in un titolo di giornale senza verbo coniugato: tema + virgola + nome d'azione (+ tempo). Le soluzioni sono modelli: sono possibili altre versioni.", "items": ["1.  La Grecia vieterà i social ai minori di 15 anni a partire dal 2027.", "2.  Il Parlamento greco ha approvato la legge sulla verifica dell'età.", "3.  A Roma il Comune rende più severe le regole sui monopattini.", "4.  In Spagna sarà vietato usare il telefono nelle scuole elementari da gennaio.", "5.  L'Ue spiega come funzionerà il nuovo portafoglio digitale.", "6.  In Francia i genitori dicono di no alla nuova riforma della scuola.", "7.  Le piattaforme dovranno verificare l'età: vi spieghiamo chi le controllerà."], "answers": ["1.  Grecia, stop ai social per i minori di 15 anni dal 2027", "2.  Grecia, via libera del Parlamento alla legge sulla verifica dell'età", "3.  Roma, stretta sui monopattini", "4.  Spagna, divieto di telefono nelle elementari da gennaio", "5.  Ue, nuovo portafoglio digitale: come funzionerà", "6.  Francia, no dei genitori alla riforma della scuola", "7.  Verifica dell'età, obbligo per le piattaforme: chi controllerà"]}]};

// ── BUILD (B1 shape: warm-up → vocab → video → reading → grammar → comprehension → exercises → discussion → homework)
function build() {
  const D = SPEC.dividers || {};
  makeTitle(SPEC.title_slide || {});

  makeDivider(D.warmup);
  makeQuestionsSlide(UI.warmupLabel, UI.warmupH2, UI.warmupSub, UI.warmupBox, SPEC.warmup.questions);
  if (SPEC.warmup.episode) makeProseSlide('Riscaldamento — Di cosa parla?', SPEC.warmup.episode.h2, SPEC.warmup.episode.sub, SPEC.warmup.episode.body);
  if (SPEC.figures) makeFiguresSlide(SPEC.figures);

  makeDivider(D.vocab);
  const per = 2; // rule: 8 cards per slide (2 groups × 4)
  for (let i = 0; i < VOCAB.length; i += per) {
    makeVocabSlide('Parole chiave — ' + (Math.floor(i/per) + 1) + '/' + Math.ceil(VOCAB.length/per), VOCAB.slice(i, i + per));
  }

  if (SPEC.video && SPEC.video.parts && SPEC.video.parts.length) {
    makeDivider(D.video);
    const vid = ytId(SPEC.video.url || SPEC.video.video_id);
    SPEC.video.parts.forEach((p, i) => makeVideoPartSlide(p, i, SPEC.video.parts.length, vid));
  }

  if (SPEC.reading) { makeDivider(D.reading); makeReadingSlide(SPEC.reading); }

  if (SPEC.grammar && SPEC.grammar.length) { makeDivider(D.grammar); SPEC.grammar.forEach(makeGramSlide); }

  makeDivider(D.comprehension);
  (SPEC.comprehension || []).forEach(makeCompSlide);

  makeDivider(D.exercises);
  if (SPEC.gapfill) { makeGapSlide(SPEC.gapfill); makeGapAnswerSlide(SPEC.gapfill); }
  if (SPEC.match) makeMatchSlide(SPEC.match);
  if (SPEC.verofalso) makeVFSlide(SPEC.verofalso);

  makeDivider(D.discussion);
  makeDiscSlide();

  if (SPEC.homework && SPEC.homework.length) { makeDivider(D.homework); SPEC.homework.forEach(makeHWSlide); }
}
build();

const TOTAL = SLIDES.length; let cur = 0;
SLIDES[0].el.classList.add('active');
const DISC_IDX = SLIDES.findIndex(s => s.el.classList.contains('disc-slide'));
function go(d) {
  SLIDES[cur].el.classList.remove('active');
  cur = Math.max(0, Math.min(TOTAL - 1, cur + d));
  SLIDES[cur].el.classList.add('active'); SLIDES[cur].el.scrollTop = 0; updateNav();
  if (cur === DISC_IDX) initMicPermission();
}
function updateNav() {
  document.getElementById('slide-label').textContent = (cur+1) + ' / ' + TOTAL + ' — ' + SLIDES[cur].label;
  document.getElementById('pb').style.width = ((cur+1)/TOTAL*100) + '%';
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === TOTAL-1;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if ((e.key==='r'||e.key==='R') && cur===DISC_IDX) toggleMic();

// ── GAP FILL ─────────────────────────────────────────────────────
let selWord = null;
function wireGap() {
  const wb = document.getElementById('wb'); const gs = document.getElementById('gap-sents'); if (!wb || !gs) return;
  [...GAP_WORDS].sort(()=>Math.random()-0.5).forEach(w => {
    const d = el('div','dword', w); d.dataset.w = w;
    d.onclick = () => { if (d.classList.contains('used')) return; document.querySelectorAll('.dword').forEach(x=>x.classList.remove('sel-w')); d.classList.add('sel-w'); selWord = w; };
    wb.appendChild(d);
  });
  GAP_SENTS.forEach(s => { const d = el('div','gap-sentence'); d.innerHTML = s.pre + ' <span class="drop-zone" data-blank="'+s.blank+'" onclick="fillZone(this)">_ _ _ _ _</span> ' + s.post; gs.appendChild(d); });
}
function fillZone(z) {
  if (!selWord || z.classList.contains('ok')) return;
  document.querySelectorAll('.drop-zone').forEach(oz=>{ if(oz!==z && oz.dataset.filled===selWord){oz.textContent='_ _ _ _ _';oz.classList.remove('filled','ok','wrong');oz.dataset.filled='';} });
  z.textContent = selWord; z.classList.add('filled'); z.dataset.filled = selWord;
  document.querySelectorAll('.dword').forEach(d=>d.classList.remove('sel-w')); selWord = null;
}
function checkGap() { document.querySelectorAll('.drop-zone').forEach(z=>{ z.classList.remove('ok','wrong'); if(z.dataset.filled===z.dataset.blank) z.classList.add('ok'); else if(z.dataset.filled) z.classList.add('wrong'); }); }
function resetGap() { document.querySelectorAll('.drop-zone').forEach(z=>{z.textContent='_ _ _ _ _';z.classList.remove('filled','ok','wrong');z.dataset.filled='';}); document.querySelectorAll('.dword').forEach(d=>d.classList.remove('used','sel-w')); selWord = null; }

// ── MATCHING ─────────────────────────────────────────────────────
let selTerm = null;
function wireMatch() {
  const tc = document.getElementById('mterms'), dc = document.getElementById('mdefs'); if (!tc || !dc) return;
  const shuffled = [...MATCH].sort(()=>Math.random()-0.5);
  MATCH.forEach((m,i)=>{ const e2 = el('div','mitem', m.t); e2.dataset.pair = i; e2.dataset.side='t';
    e2.onclick = () => { if (e2.classList.contains('matched')) return; document.querySelectorAll('.mitem[data-side="t"]').forEach(x=>x.classList.remove('sel')); e2.classList.add('sel'); selTerm = e2; };
    tc.appendChild(e2); });
  shuffled.forEach(m=>{ const oi = MATCH.findIndex(x=>x.d===m.d); const e2 = el('div','mitem', m.d); e2.dataset.pair = oi; e2.dataset.side='d';
    e2.onclick = () => { if (!selTerm || e2.classList.contains('matched')) return;
      if (selTerm.dataset.pair === e2.dataset.pair) { selTerm.classList.remove('sel'); selTerm.classList.add('matched'); e2.classList.add('matched'); selTerm = null; }
      else { e2.classList.add('bad'); setTimeout(()=>e2.classList.remove('bad'),500); const st = selTerm; selTerm = null; st.classList.add('bad'); setTimeout(()=>st.classList.remove('bad','sel'),500); } };
    dc.appendChild(e2); });
}

}
function checkVF(btn, chosen, correct, idx) {
  btn.closest('.vf-row').querySelectorAll('.vfb').forEach(b=>b.classList.remove('correct','incorrect'));
  if (chosen===correct) btn.classList.add('correct');
  else { btn.classList.add('incorrect'); const n=document.getElementById('vfn'+idx); if(n) n.classList.add('show'); }
}

// ── DISCUSSION + MIC ─────────────────────────────────────────────
let dIdx=0, recog=null, recording=false, micOK=false, micStream=null;
function wireDisc() {
  const dots = document.getElementById('ddots'); if (!dots) return;
  DISC.forEach((_,i)=>{ const d = el('div','disc-dot'+(i===0?' active':'')); d.onclick = () => gotoDisc(i); dots.appendChild(d); });
  loadDisc();
}
function loadDisc() {
  const dq = document.getElementById('dq'); if (!dq) return;
  dq.textContent = DISC[dIdx].q;
  document.getElementById('dqnum').textContent = (dIdx+1) + '. ' + UI.question + UI.ofN + DISC.length;
  document.getElementById('dmtext').textContent = DISC[dIdx].m;
  document.getElementById('dmbox').classList.add('blur');
  if (!recording) { const ub = document.getElementById('dubox'); ub.innerHTML=''; ub.appendChild(el('span','ph', UI.micPh)); ub.classList.remove('listening'); }
  document.querySelectorAll('.disc-dot').forEach((d,i)=>d.classList.toggle('active', i===dIdx));
  const pb = document.getElementById('dprev'), nb = document.getElementById('dnext');
  if (pb) pb.disabled = dIdx === 0;
  if (nb) { const last = dIdx >= DISC.length - 1; nb.textContent = last ? UI.nextSlide : UI.next; nb.classList.toggle('to-slide', last); }
}
function dNav(d) { document.querySelectorAll('.disc-dot')[dIdx].classList.add('done'); dIdx = Math.max(0, Math.min(DISC.length-1, dIdx+d)); loadDisc(); }
function gotoDisc(i){ dIdx=i; loadDisc(); }
function revealModel(){ document.getElementById('dmbox').classList.toggle('blur'); }
function initMicPermission() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; return; }
  if (micOK && micStream && micStream.active) return;
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => { micStream = stream; micOK = true; const st = document.getElementById('micstat'); if (st) st.textContent = UI.micReady; })
      .catch(e => { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; } });
  }
}
function toggleMic(){ recording ? stopMic() : startMic(); }
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  recog = new SR(); recog.lang='it-IT'; recog.continuous=true; recog.interimResults=true;
  const box = document.getElementById('dubox'); box.innerHTML=''; box.classList.add('listening');
  let final='';
  recog.onresult = e => { let interim=''; for (let i=e.resultIndex; i<e.results.length; i++) { if (e.results[i].isFinal) final += e.results[i][0].transcript + ' '; else interim += e.results[i][0].transcript; } box.textContent = final + interim; micOK = true; };
  recog.onerror = e => { if (e.error!=='no-speech') stopMic(); };
  recog.onend = () => { if (recording) recog.start(); };
  recog.start(); recording = true;
  document.getElementById('micbtn').classList.add('on'); document.getElementById('micbtn').textContent = '⏹';
  document.getElementById('micstat').textContent = UI.micRec;
}
function stopMic() {
  if (recog) { recog.stop(); recog=null; } recording=false;
  document.getElementById('micbtn').classList.remove('on'); document.getElementById('micbtn').textContent = '🎤';
  document.getElementById('micstat').textContent = UI.micPause; document.getElementById('dubox').classList.remove('listening');
}
function toggleAK(id){ document.getElementById(id).classList.toggle('show'); }

wireGap(); wireMatch(); wireVF(); wireDisc();

// ── Text-size control ────────────────────────────────────────────
(function(){
  let z = 100;
  const bar = document.createElement('div'); bar.id='tsize';
  bar.innerHTML = '<span>' + UI.tsize + '</span><button id="tsm">A−</button><span id="tsv">100%</span><button id="tsp">A+</button><button id="tsr">⟲</button>';
  const _tb=document.getElementById('topbar'), _nb=document.getElementById('nav-btns');
  if(_tb && _nb) _tb.insertBefore(bar, _nb); else document.body.appendChild(bar);
  function apply(){ document.getElementById('viewport').style.zoom = (z/100); document.getElementById('tsv').textContent = z+'%'; }
  document.getElementById('tsm').onclick = ()=>{ z=Math.max(70,z-10); apply(); };
  document.getElementById('tsp').onclick = ()=>{ z=Math.min(220,z+10); apply(); };
  document.getElementById('tsr').onclick = ()=>{ z=100; apply(); };
})();
</script>
