<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nave Vespucci: si naviga ancora con le stelle nell&#x27;era dei droni — Goodman Italiano B1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: Calibri, 'Segoe UI', sans-serif;
  background: #0e8388;
  color: #1e2a2e;
}

/* ── TOP BAR ── */
#pb-wrap { position: fixed; top: 0; left: 0; right: 0; height: 5px; background: rgba(255,255,255,0.2); z-index: 200; }
#pb { height: 5px; background: #fb6a5a; transition: width 0.3s; width: 0%; }

#topbar {
  position: fixed; top: 5px; left: 0; right: 0; height: 50px;
  background: #0e8388; z-index: 199;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2vw;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}
#slide-label { color: white; font-size: 1.5vw; font-weight: 700; }
#nav-btns { display: flex; gap: 1vw; }
.nbtn {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
  color: white; padding: 0.4vh 1.5vw; border-radius: 5px;
  cursor: pointer; font-size: 1.3vw; font-family: inherit; font-weight: 600;
}
.nbtn:hover { background: rgba(255,255,255,0.28); }
.nbtn:disabled { opacity: 0.3; cursor: default; }

/* ── VIEWPORT ── */
#viewport {
  position: fixed;
  top: 55px; left: 0; right: 0; bottom: 0;
}

/* ── SLIDES ── */
.slide {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: all; }

/* ════════════════════════════════
   DIVIDER SLIDES
════════════════════════════════ */
.div-slide {
  background: linear-gradient(160deg, #073c40 0%, #0e8388 60%, #0a5458 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 6vw;
  position: relative;
}
.div-slide::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 0.8vh; background: #fb6a5a;
}
.div-icon { font-size: 7vw; line-height: 1; margin-bottom: 2vh; }
.div-num { font-size: 1.2vw; letter-spacing: 0.4vw; text-transform: uppercase; opacity: 0.5; margin-bottom: 1.5vh; font-weight: 700; }
.div-slide h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 5.5vw; line-height: 1.1; margin-bottom: 2.5vh; }
.div-desc { font-size: 1.7vw; opacity: 0.78; max-width: 70vw; line-height: 1.6; margin-bottom: 3.5vh; }
.div-tags { display: flex; flex-wrap: wrap; gap: 1vw; justify-content: center; max-width: 75vw; }
.div-tag {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
  border-radius: 3vw; padding: 0.8vh 2vw; font-size: 1.3vw;
}

/* ════════════════════════════════
   TITLE SLIDE
════════════════════════════════ */
.title-slide {
  background: linear-gradient(150deg, #052b2e 0%, #0e8388 100%);
  color: white;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 3vh 4vw;
}
.pod-label { font-size: 1.5vw; letter-spacing: 0.4vw; text-transform: uppercase; color: #fb6a5a; margin-bottom: 3vh; font-weight: 700; }
.title-slide h1 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 6.5vw; line-height: 1.15; width: 90vw; margin-bottom: 3.5vh; }
.red-line { width: 6vw; height: 0.6vh; background: #fb6a5a; margin: 0 auto 3vh; }
.title-meta { display: flex; gap: 4vw; font-size: 1.8vw; opacity: 0.65; flex-wrap: wrap; justify-content: center; }

/* ════════════════════════════════
   CONTENT SLIDE BASE
════════════════════════════════ */
.con-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.slide-head {
  border-left: 0.5vw solid #fb6a5a;
  padding-left: 1.5vw;
  margin-bottom: 2.5vh;
  flex-shrink: 0;
}
.slide-head h2 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 3.2vw; line-height: 1.15; margin-bottom: 0.4vh; }
.sub { color: #5e7377; font-size: 1.3vw; }

/* ════════════════════════════════
   ANTICIPAZIONE — split slides
════════════════════════════════ */
.single-box {
  flex: 1;
  background: #e6f3f2;
  border-radius: 1vw;
  padding: 3vh 3vw;
  border-top: 0.5vh solid #0e8388;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.single-box h3 { color: #0e8388; font-size: 2.2vw; margin-bottom: 2.5vh; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
.single-box ol { padding-left: 2.5vw; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.single-box ol li { font-size: 2vw; line-height: 1.6; }
.single-box p { font-size: 2vw; line-height: 1.75; flex: 1; display: flex; align-items: center; }

/* ════════════════════════════════
   FIGURE CHIAVE
════════════════════════════════ */
.figures-slide {
  background: #ffeae6;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.figures-slide .slide-head { border-color: #fb6a5a; }
.figures-slide .slide-head h2 { color: #e24e3e; }
.figures-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1.5vh 2vw;
  flex: 1;
}
.figure-card {
  background: white; border-radius: 0.8vw;
  border-left: 0.5vw solid #fb6a5a;
  padding: 1.5vh 2vw;
  display: flex; flex-direction: column; justify-content: center;
}
.figure-card .fname { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 1.9vw; font-weight: 700; color: #0e8388; margin-bottom: 0.8vh; }
.figure-card .fdesc { font-size: 1.35vw; color: #3a4a4e; line-height: 1.5; }

/* ════════════════════════════════
   VOCABULARY
════════════════════════════════ */
.vocab-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 2vh 4vw 2vh;
  overflow: hidden;
}
.vocab-group-label {
  font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase;
  color: #5e7377; font-weight: 700; margin: 1.2vh 0 1vh;
  padding-bottom: 0.6vh; border-bottom: 2px solid #d7e6e4;
  flex-shrink: 0;
}
.vocab-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1.2vh 2vw; flex: 1;
}
.vcard {
  background: white; border-radius: 0.8vw;
  box-shadow: 0 3px 12px rgba(0,0,0,0.09);
  cursor: pointer; perspective: 900px;
}
.vcard-inner {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.45s;
}
.vcard.flipped .vcard-inner { transform: rotateY(180deg); }
.vfront, .vback {
  position: absolute; width: 100%; height: 100%;
  border-radius: 0.8vw; padding: 1.8vh 1.8vw;
  backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
}
.vfront { background: white; }
.vfront .term { font-size: 2vw; font-weight: 700; color: #1e2a2e; line-height: 1.3; flex: 1; display: flex; align-items: center; }
.vfront .vbottom { display: flex; flex-direction: column; gap: 0.6vh; flex-shrink: 0; }
.vfront .rtag { display: inline-block; font-size: 1vw; padding: 0.3vh 0.8vw; border-radius: 2vw; background: #e6f3f2; color: #0e8388; font-weight: 600; align-self: flex-start; }
.vfront .hint { font-size: 1.1vw; color: #9bb0b2; }
.vback { background: #e6f3f2; transform: rotateY(180deg); }
.vback .en { font-size: 1.8vw; font-weight: 700; color: #0e8388; margin-bottom: 1vh; }
.vback .ex { font-size: 1.2vw; font-style: italic; color: #1e2a2e; border-left: 0.3vw solid #fb6a5a; padding-left: 0.8vw; line-height: 1.55; flex: 1; }
.vback .rnote { font-size: 0.95vw; color: #5e7377; margin-top: 0.8vh; flex-shrink: 0; }

/* ════════════════════════════════
   GRAMMAR
════════════════════════════════ */
.gram-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.gram-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #0a6e72;
  flex: 1; display: flex; flex-direction: column;
}
.gram-block h3 { color: #0e8388; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.5vw; margin-bottom: 1.5vh; line-height: 1.2; }
.gram-block .expl { font-size: 1.55vw; color: #3a4a4e; line-height: 1.7; margin-bottom: 2vh; flex-shrink: 0; }
.gram-block ul { list-style: none; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gram-block ul li { background: #e6f3f2; border-radius: 0.6vw; padding: 1.5vh 1.5vw; font-size: 1.45vw; font-style: italic; line-height: 1.6; }
.gram-block ul li strong { font-style: normal; color: #fb6a5a; font-size: 1.5vw; }
.gram-block .snote { font-size: 1.35vw; color: #1E8449; font-weight: 600; margin-top: 2vh; line-height: 1.55; padding: 1.5vh 1.5vw; background: #EAFAF1; border-radius: 0.6vw; flex-shrink: 0; }

/* ════════════════════════════════
   COMPREHENSION
════════════════════════════════ */
.comp-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.comp-label { font-size: 1.2vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 2vh; font-weight: 700; padding-bottom: 1vh; border-bottom: 2px solid #d7e6e4; flex-shrink: 0; }
.qlist { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; }
.qitem { background: white; border-radius: 0.8vw; padding: 2vh 2.5vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 1.5vw; font-size: 1.8vw; line-height: 1.65; flex: 1; align-items: center; }
.qnum { color: #fb6a5a; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2.2vw; min-width: 2.5vw; flex-shrink: 0; }

/* ════════════════════════════════
   CULTURAL
════════════════════════════════ */
.cult-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.cult-block {
  background: white; border-radius: 1vw;
  padding: 3vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  border-left: 0.6vw solid #fb6a5a;
  flex: 1; display: flex; flex-direction: column;
}
.cult-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.4vw; margin-bottom: 2vh; line-height: 1.2; flex-shrink: 0; }
.cult-block p { font-size: 1.6vw; line-height: 1.8; flex: 1; }
.en-gl { font-style: italic; color: #5e7377; font-size: 1.2vw; margin-top: 1.5vh; display: block; flex-shrink: 0; }
.cult-hook { margin-top: 2.5vh; padding: 1.5vh 2vw; background: #fff1ef; border-radius: 0.6vw; font-size: 1.45vw; color: #e24e3e; line-height: 1.6; flex-shrink: 0; }

/* ════════════════════════════════
   EXERCISES
════════════════════════════════ */
.ex-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ex-block {
  background: white; border-radius: 1vw;
  padding: 2.5vh 3vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  flex: 1; display: flex; flex-direction: column;
}
.ex-block h3 { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: #0e8388; font-size: 2.2vw; margin-bottom: 0.8vh; flex-shrink: 0; }
.ex-instr { font-size: 1.3vw; color: #5e7377; margin-bottom: 1.8vh; line-height: 1.6; flex-shrink: 0; }

/* Gap fill */
.word-bank { display: flex; flex-wrap: wrap; gap: 1vw; margin-bottom: 2vh; padding: 1.5vh 1.5vw; background: #e6f3f2; border-radius: 0.8vw; flex-shrink: 0; }
.dword { background: #0e8388; color: white; padding: 0.8vh 2vw; border-radius: 3vw; font-size: 1.5vw; cursor: pointer; user-select: none; font-weight: 600; }
.dword.sel-w { outline: 0.3vw solid #fb6a5a; outline-offset: 0.2vw; }
.dword.used { opacity: 0.3; cursor: default; }
.gap-sentences { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.gap-sentence { font-size: 1.6vw; line-height: 1.4; }
.drop-zone { display: inline-block; min-width: 10vw; border-bottom: 0.2vw solid #0e8388; margin: 0 0.5vw; padding: 0 0.5vw; color: #9bb0b2; font-style: italic; cursor: pointer; vertical-align: bottom; font-size: 1.5vw; }
.drop-zone.filled { color: #1e2a2e; font-style: normal; font-weight: 700; background: #e6f3f2; border-radius: 0.3vw; border-bottom-color: #0a6e72; }
.drop-zone.ok { border-bottom-color: #1E8449; background: #EAFAF1; color: #1E8449; }
.drop-zone.wrong { border-bottom-color: #fb6a5a; background: #ffeae6; color: #fb6a5a; }
.ex-btns { display: flex; gap: 1vw; margin-top: 1.5vh; flex-shrink: 0; }

/* Answer key slide */
.ak-slide {
  background: #EAFAF1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.ak-slide .slide-head { border-color: #1E8449; }
.ak-slide .slide-head h2 { color: #1E8449; }
.ak-content { background: white; border-radius: 1vw; padding: 2vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-left: 0.6vw solid #1E8449; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
.ak-item { display: flex; gap: 1.5vw; align-items: center; padding: 1.5vh 2vw; background: #F4FDF8; border-radius: 0.6vw; font-size: 1.55vw; line-height: 1.6; }
.ak-num { color: #1E8449; font-weight: 700; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; min-width: 2.5vw; }
.ak-word { font-weight: 700; color: #1E8449; }
.ak-quote { font-style: italic; color: #5e7377; }

/* Matching */
.match-wrap { flex: 1; display: flex; flex-direction: column; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; margin-bottom: 1.5vh; }
.match-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 1vh; font-weight: 700; }
.mitem { padding: 1.5vh 1.8vw; border-radius: 0.6vw; margin-bottom: 0.8vh; font-size: 1.45vw; cursor: pointer; border: 0.2vw solid transparent; background: #e6f3f2; transition: all 0.18s; line-height: 1.45; }
.mitem:hover { border-color: #0a6e72; }
.mitem.sel { border-color: #0e8388; background: #cde9e7; font-weight: 700; }
.mitem.matched { border-color: #1E8449; background: #EAFAF1; color: #1E8449; cursor: default; font-weight: 600; }
.mitem.bad { border-color: #fb6a5a; background: #ffeae6; }

/* VF */
.vf-list { flex: 1; display: flex; flex-direction: column; gap: 1.2vh; }
.vf-row { display: flex; gap: 1.5vw; align-items: center; padding: 1.8vh 2vw; background: white; border-radius: 0.8vw; box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 1.5vw; line-height: 1.6; flex: 1; }
.vf-btns { display: flex; gap: 0.6vw; flex-shrink: 0; }
.vfb { padding: 0.6vh 1.2vw; border-radius: 2vw; border: 0.2vw solid; font-size: 1.2vw; font-weight: 700; cursor: pointer; background: transparent; font-family: inherit; }
.vfb.V { border-color: #1E8449; color: #1E8449; }
.vfb.F { border-color: #fb6a5a; color: #fb6a5a; }
.vfb.N { border-color: #5e7377; color: #5e7377; }
.vfb.correct { background: #1E8449; color: white; border-color: #1E8449; }
.vfb.incorrect { background: #fb6a5a; color: white; border-color: #fb6a5a; }
.vf-note { font-size: 1.1vw; color: #1E8449; font-style: italic; margin-top: 0.5vh; display: none; }
.vf-note.show { display: block; }

/* Buttons */
.ak-btn { padding: 1vh 2vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; cursor: pointer; font-size: 1.3vw; font-weight: 700; font-family: inherit; flex-shrink: 0; }
.ak-btn:hover { opacity: 0.85; }
.ak-btn.grey { background: #5e7377; }
.answer-key { display: none; margin-top: 1.5vh; padding: 1.5vh 2vw; background: #EAFAF1; border-radius: 0.8vw; border-left: 0.4vw solid #1E8449; font-size: 1.3vw; line-height: 1.9; flex-shrink: 0; }
.answer-key.show { display: block; }

/* ════════════════════════════════
   DISCUSSION
════════════════════════════════ */
.disc-slide {
  background: #fbfdfd;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 3vh 4vw;
  overflow: hidden;
}
.disc-card { background: white; border-radius: 1vw; padding: 2.5vh 3vw; box-shadow: 0 4px 16px rgba(0,0,0,0.08); flex: 1; display: flex; flex-direction: column; }
.disc-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2vh; flex-shrink: 0; }
.disc-dots { display: flex; gap: 0.8vw; }
.disc-dot { width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #e6f3f2; border: 0.2vw solid #0a6e72; cursor: pointer; }
.disc-dot.active { background: #0e8388; }
.disc-dot.done { background: #1E8449; border-color: #1E8449; }
.disc-qnum { font-size: 1.4vw; color: #5e7377; font-weight: 600; }
.disc-q { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 2vw; line-height: 1.6; color: #1e2a2e; margin-bottom: 2vh; flex-shrink: 0; }
.disc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; flex: 1; min-height: 0; }
.disc-col { display: flex; flex-direction: column; min-height: 0; }
.disc-col-label { font-size: 1.1vw; letter-spacing: 0.2vw; text-transform: uppercase; color: #5e7377; margin-bottom: 0.8vh; font-weight: 700; flex-shrink: 0; }
.disc-user-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #e6f3f2; font-size: 1.4vw; line-height: 1.7; border: 0.2vw solid transparent; min-height: 0; overflow-y: auto; }
.disc-user-box.listening { border-color: #fb6a5a; background: #ffeae6; }
.disc-user-box .ph { color: #9bb0b2; font-style: italic; }
.disc-model-box { flex: 1; padding: 1.5vh 1.5vw; border-radius: 0.8vw; background: #EAFAF1; font-size: 1.3vw; line-height: 1.8; min-height: 0; overflow-y: auto; }
.disc-model-box.blur .mtext { filter: blur(6px); user-select: none; }
.reveal-btn { display: inline-block; margin-top: 0.8vh; padding: 0.7vh 1.8vw; background: #1E8449; color: white; border: none; border-radius: 0.5vw; font-size: 1.2vw; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.mic-row { display: flex; align-items: center; gap: 1.5vw; margin-top: 1.5vh; flex-shrink: 0; }
.mic-btn { width: 5vw; height: 5vw; border-radius: 50%; border: none; background: #fb6a5a; color: white; font-size: 2.2vw; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(192,57,43,0.38); flex-shrink: 0; }
.mic-btn.on { background: #1E8449; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(30,132,73,0.5); } 50% { box-shadow: 0 0 0 1vw rgba(30,132,73,0); } }
.mic-status { font-size: 1.2vw; color: #5e7377; line-height: 1.5; }
.disc-nav { display: flex; gap: 1vw; justify-content: flex-end; margin-top: 1.5vh; flex-shrink: 0; }

i si orienta con le stelle»"}, {"it": "a bordo / salire a bordo", "en": "on board / to go on board", "ex": "salire a bordo significa ricevere il «Battesimo del Mare»", "reg": "neutro; vale per navi, aerei, treni"}, {"it": "l'imbarco / imbarcarsi", "en": "embarkation, tour of duty at sea / to embark", "ex": "il suo primo imbarco risale al 1998", "reg": "marinaresco; «essere imbarcato» = to serve on a ship"}, {"it": "fare scalo", "en": "to call at (a port), to stop over", "ex": "è arrivato in Canada, dove ha fatto scalo in altri due porti", "reg": "tecnico/giornalistico; anche per voli: «uno scalo a Francoforte»"}]}, {"group": "🎓  Formazione e tradizione", "items": [{"it": "l'allievo / l'allieva ufficiale", "en": "officer cadet", "ex": "addestrare gli allievi ufficiali dell'Accademia Navale", "reg": "militare/scolastico; «allievo» = pupil, trainee"}, {"it": "addestrare / l'addestramento", "en": "to train / training", "ex": "una missione che ha unito addestramento, diplomazia e promozione", "reg": "si usa per militari, sportivi, animali; per lo studio si dice «formare»"}, {"it": "tramandare", "en": "to hand down, to pass on", "ex": "un sapere che si tramanda da quasi un secolo", "reg": "formale; «tramandare di generazione in generazione»"}, {"it": "il mestiere", "en": "trade, craft, job", "ex": "chi oggi sale a bordo per imparare il mestiere del marinaio", "reg": "neutro; più concreto e artigianale di «professione»"}]}, {"group": "🤖  Tecnologia e difesa", "items": [{"it": "il drone", "en": "drone", "ex": "i droni aerei, di superficie e subacquei", "reg": "neutro; plurale «i droni»"}, {"it": "subacqueo / subacquea", "en": "underwater, undersea", "ex": "la dimensione subacquea è uno degli ambiti più importanti", "reg": "tecnico; come nome «il subacqueo» = diver"}, {"it": "la minaccia", "en": "threat", "ex": "nuove minacce e sistemi d'arma sempre più sofisticati", "reg": "giornalistico; verbo «minacciare» = to threaten"}, {"it": "il reclutamento", "en": "recruitment", "ex": "una delle criticità strutturali della Marina: il reclutamento", "reg": "formale; «reclutare» = to recruit"}]}], "video": {"url": "https://www.youtube.com/watch?v=eN95Xf5H3uw", "title": "Vespucci, come si formano gli ufficiali di Marina nell'era dei droni", "channel": "euronews (in italiano)", "parts": [{"summary": "Il servizio ci porta a bordo dell'Amerigo Vespucci, la nave scuola della Marina Militare italiana. Sul veliero ci sono satelliti, radar e navigazione elettronica, ma gli allievi ufficiali imparano ancora a orientarsi con le stelle: un sapere che si tramanda da quasi un secolo. Intanto la Marina si prepara al futuro: investe in droni, sottomarini e nuove tecnologie per affrontare le sfide del mare, dalla sicurezza delle rotte alla dimensione subacquea."}]}, "reading": {"title": "Tra le stelle e i droni", "lead": "Sul Vespucci si impara a navigare come cento anni fa. Ma la Marina italiana guarda già al futuro.", "paragraphs": ["Durante la navigazione sul fiume San Lorenzo, in Canada, l'Amerigo Vespucci ha dovuto abbassare i suoi alberi per passare sotto tre ponti. Una scena che sembra di un'altra epoca, ma che racconta bene la vita sulla nave scuola della Marina Militare. Sul Vespucci, infatti, la modernità non ha cancellato la tradizione: a bordo ci sono GPS, radar e comunicazioni satellitari, ma gli allievi imparano ancora a orientarsi osservando il cielo.", "«Ancora oggi insegniamo agli allievi come si naviga con le stelle», racconta il comandante, il Capitano di Vascello Nicasio Falica. Lontano dalla costa, gli allievi riconoscono le stelle, ne misurano l'altezza sull'orizzonte e con alcuni calcoli trovano la posizione della nave. Non è precisa come quella del GPS, ma è un sapere che si tramanda da quasi un secolo.", "Il Vespucci, varato nel 1931, forma gli allievi ufficiali dell'Accademia Navale di Livorno. Dopo il primo anno di studi a terra, salire a bordo significa ricevere il «Battesimo del Mare». Quest'anno 163 allievi sono saliti sulla nave a Baltimora, negli Stati Uniti, per tre mesi di navigazione fino all'Italia. Nell'ultima campagna si sono percorse oltre 16mila miglia e più di 200mila visitatori sono saliti a bordo.", "Sulle navi moderne, invece, l'automazione e i droni stanno cambiando il lavoro in mare. «L'automazione sta portando a una certa riduzione degli equipaggi», spiega Alessandro Marrone dell'Istituto Affari Internazionali. Questo può aiutare la Marina, che ha difficoltà a trovare nuovo personale: chi lavora sulle navi passa lunghi periodi lontano da casa. Integrare i droni a bordo, però, non è facile, perché sulla nave lo spazio e l'energia sono limitati.", "Oggi la Marina deve proteggere le rotte commerciali nel Mediterraneo e nel Mar Rosso e investe molto nei sottomarini, perché sott'acqua si gioca una parte importante della competizione del futuro. Ma, come dice il comandante, per operare sui mari bisogna prima conoscerli: «Mi piace pensare che sia un unico equipaggio, quello di nave Vespucci, che dal 1931 continua a insegnare come si va per mare»."], "url": "https://it.euronews.com/2026/11/17/satelliti-droni-e-navi-senza-equipaggio-la-marina-del-futuro-parte-dalla-conoscenza-del-ma"}, "grammar": [{"label": "Grammatica — Si impersonale e si passivante", "subtitle": "«Insegniamo agli allievi come si naviga con le stelle» · «Vespucci, come si formano gli ufficiali di Marina» · «un sapere che si tramanda da quasi un secolo» · «Si è passati da una produzione su licenza a una nuova classe di sottomarini»", "title": "Chi fa l'azione? «Si»: la gente, tutti, noi", "expl": "Nel titolo del servizio leggiamo: «Vespucci, come SI FORMANO gli ufficiali di Marina». E il comandante dice: «insegniamo agli allievi come SI NAVIGA con le stelle». In tutte e due le frasi c'è il SI, ma con due funzioni diverse. Il «si» serve a NON dire chi fa l'azione: la persona è generica (la gente, tutti, noi, uno) oppure non è importante. È una struttura frequentissima nei giornali, nelle istruzioni, nelle regole e nella lingua di tutti i giorni. 1) SI IMPERSONALE. Il verbo è SEMPRE alla 3ª persona SINGOLARE e non c'è un soggetto grammaticale: «si naviga con le stelle» (= la gente naviga, noi navighiamo), «come si va per mare», «se si guarda alla sicurezza europea». Si usa con i verbi INTRANSITIVI (andare, navigare, vivere, partire), con i verbi che reggono una preposizione («si guarda alla sicurezza», «si parla di droni») e con i verbi transitivi SENZA oggetto («a bordo si mangia presto»). 2) SI PASSIVANTE. Con un verbo TRANSITIVO + oggetto, l'oggetto diventa il SOGGETTO grammaticale e il verbo si ACCORDA con lui: «si forma un ufficiale» / «si FORMANO gli ufficiali»; «un sapere che si tramanda» (soggetto: il sapere); «si gioca una parte importante della competizione». Il significato è passivo: «si formano gli ufficiali» = «gli ufficiali vengono formati». Il soggetto di solito va DOPO il verbo. Attenzione: con il si passivante NON si esprime chi fa l'azione (× «si formano gli ufficiali dalla Marina»): se serve l'agente, si usa il passivo con essere o venire («gli ufficiali vengono formati dalla Marina»). Nell'italiano parlato si sente a volte «si vende appartamenti», «si affitta camere»: è considerato un errore; la forma corretta è «si vendono appartamenti», «si affittano camere». 3) I TEMPI COMPOSTI: SEMPRE ESSERE. Con il si si usa sempre l'ausiliare essere. • Si passivante: il participio si accorda con il soggetto: «nell'ultima campagna si sono percorse oltre 16mila miglia», «si è costruita una nuova classe di sottomarini». • Si impersonale con un verbo che normalmente vuole AVERE: participio in -O (maschile singolare): «a bordo si è lavorato molto», «si è navigato per tre mesi». • Si impersonale con un verbo che normalmente vuole ESSERE: participio al MASCHILE PLURALE in -I: «SI È PASSATI da una produzione su licenza a una nuova classe di sottomarini» (dall'articolo), «si è arrivati a Boston», «si è partiti da Baltimora». È uno dei punti più difficili anche per gli italiani: il plurale c'è perché il soggetto nascosto è «la gente, noi tutti». 4) AGGETTIVI E NOMI DOPO IL SI IMPERSONALE: anche loro vanno al PLURALE: «quando si è giovani, si è pronti a partire»; «a bordo si diventa più responsabili»; «si è tutti marinai». 5) CI SI. Con un verbo riflessivo o pronominale (orientarsi, alzarsi, abituarsi) non si può dire «si si»: si dice CI SI: «sul Vespucci ci si alza presto», «senza GPS ci si orienta con le stelle», «dopo una settimana ci si abitua alle onde». Nei tempi composti: «ci si è abituati» (participio plurale). 6) SI E ALTRI PRONOMI. I pronomi atoni vanno PRIMA del si: «la rotta, LA si calcola con le stelle»; «gli allievi, LI si forma a Livorno» (qui il verbo resta singolare!); «GLI si insegna il mestiere» (= a lui / a loro si insegna); «MI si chiede spesso…». Fa eccezione NE, che va DOPO e trasforma si in SE: «di droni SE NE parla molto»; «stelle, se ne riconoscono tante». 7) CON I VERBI MODALI. Potere, dovere, volere + infinito: il modale si accorda con l'oggetto dell'infinito: «si possono riconoscere le stelle», «si devono integrare i droni a bordo». Senza oggetto, il modale resta singolare: «si può navigare anche di notte». Il si può anche andare dopo l'infinito (registro più formale): «possono riconoscersi le stelle». 8) NON CONFONDERE. Non ogni «si» è impersonale o passivante! • Si RIFLESSIVO: l'azione torna sul soggetto: «l'allievo si prepara». • Si PRONOMINALE: fa parte del verbo: «il veliero si fa strada lungo un fiume», «l'equipaggio si arricchisce della presenza degli allievi», «la Marina si dota di tecnologie avanzate» (dall'articolo). • Si RECIPROCO: «gli allievi si aiutano». TEST: se puoi aggiungere un soggetto preciso che compie l'azione su sé stesso, è riflessivo/pronominale; se puoi trasformare la frase con «la gente…» (impersonale) o con «viene + participio» (passivante), è impersonale o passivante. 9) IL SI NEL GIORNALISMO. I giornali amano il si con i verbi di opinione e di informazione: «si stima che…», «si ritiene che…», «si apprende che…» (= we learn that), «si teme…», «si prevede…». Così il giornalista presenta una notizia senza dire chi è la fonte. Altre formule comuni: «si tratta di…» (= it is about…, «Non si tratta di un passaggio semplice»), «si dice che…», «si sa che…». 10) NOTA PER CHI TRADUCE. L'inglese non ha una sola forma equivalente: secondo il contesto il si diventa «you» generico («you navigate by the stars»), «one», «we», «people», «they» o una forma passiva («officers are trained», «16,000 miles were covered»). Al contrario, molti passivi inglesi senza agente si traducono meglio con il si che con «essere/venire + participio»: «Italian is spoken here» = «Qui si parla italiano»; «It is estimated that…» = «Si stima che…»; «How are officers trained?» = «Come si formano gli ufficiali?». E «There's no getting used to it» → «Non ci si abitua». Attenzione, invece, a «si è passati»: in inglese «we/they moved from… to…» o «there has been a shift from… to…».", "examples": [["«Insegniamo agli allievi come si naviga con le stelle»", " — si impersonale con verbo intransitivo: verbo sempre singolare (dall'articolo)"], ["«Vespucci, come si formano gli ufficiali di Marina»", " — si passivante: verbo plurale, soggetto «gli ufficiali» (titolo del servizio)"], ["«un sapere che si tramanda da quasi un secolo»", " — si passivante singolare: il sapere viene tramandato (dall'articolo)"], ["«Si è passati da una produzione su licenza a una nuova classe di sottomarini»", " — si impersonale + verbo con essere: participio plurale in -i (dall'articolo)"], ["Nell'ultima campagna si sono percorse oltre 16mila miglia.", " — si passivante nei tempi composti: participio accordato con il soggetto"], ["Sul Vespucci ci si alza presto e ci si orienta con le stelle.", " — verbo riflessivo: «ci si», non «si si»"], ["Di droni se ne parla molto; la rotta la si calcola a mano.", " — si con ne (se ne) e con un pronome diretto (la si)"], ["«Il veliero si fa strada lungo un fiume canadese»", " — NON impersonale: si pronominale con un soggetto preciso (dall'articolo)"]], "snote": "Due domande: 1) C'è un oggetto diretto? Se sì → si passivante: il verbo si accorda con quell'oggetto, che diventa soggetto («si formano gli ufficiali»). Se no → si impersonale: verbo singolare («si naviga», «si parla di droni»). 2) Tempo composto? Sempre essere: passivante → participio accordato con il soggetto; impersonale → -o se il verbo vuole avere («si è lavorato»), -i se vuole essere («si è passati»). Con i riflessivi: ci si. Con ne: se ne."}], "comprehension": [{"label": "Comprensione", "h2": "Comprensione", "sub": "1–3: fatti dal servizio · 4–6: domande aperte", "compLabel": "📻 Fatti dal servizio (1–3)  ·  💭 Domande aperte (4–6)", "questions": [["1.", "Che cos'è l'Amerigo Vespucci e a che cosa serve?", "È un veliero della Marina Militare italiana, varato nel 1931. È una nave scuola: serve a formare gli allievi ufficiali dell'Accademia Navale di Livorno, che a bordo fanno la loro prima vera esperienza di navigazione."], ["2.", "Che cosa imparano ancora gli allievi, anche se a bordo ci sono GPS e satelliti?", "Imparano a orientarsi con le stelle: le riconoscono, ne misurano l'altezza sull'orizzonte e con alcuni calcoli trovano la posizione della nave. È un sapere che si tramanda da quasi un secolo."], ["3.", "In che modo sta cambiando la Marina italiana?", "Investe in droni, sottomarini e nuove tecnologie. Sulle navi moderne l'automazione e i sistemi senza equipaggio cambiano il modo di lavorare in mare e riducono il numero di persone necessarie a bordo."], ["4.", "Perché, secondo te, la Marina insegna ancora a navigare con le stelle, se esistono il GPS e i satelliti?", "Secondo me perché la tecnologia può non funzionare: un satellite si può guastare o un segnale si può disturbare. E poi conoscere il cielo e il mare insegna a capire davvero come si naviga, non solo a leggere uno schermo."], ["5.", "Ti piacerebbe fare un'esperienza di tre mesi su un veliero come il Vespucci? Che cosa ti piacerebbe e che cosa ti sembrerebbe difficile?", "Mi piacerebbe vedere tanti porti e imparare un mestiere antico. Difficile, invece, sarebbe vivere in uno spazio piccolo con tante persone, alzarsi presto e stare lontano dalla famiglia per tanto tempo."], ["6.", "Secondo te, le macchine e i droni sostituiranno le persone in molti lavori? Che cosa deve restare umano?", "In parte sì: le macchine fanno già molti lavori ripetitivi o pericolosi. Ma secondo me le decisioni importanti, la responsabilità e la trasmissione dell'esperienza tra le generazioni devono restare nelle mani delle persone."]]}], "gapfill": {"heading": "Completa le frasi in base al servizio!", "words": ["veliero", "stelle", "allievi", "droni", "tramanda"], "sents": [{"pre": "1.  L'Amerigo Vespucci è un", "blank": "veliero", "post": "della Marina Militare italiana."}, {"pre": "2.  Gli allievi ufficiali imparano ancora a orientarsi con le", "blank": "stelle", "post": "."}, {"pre": "3.  Sulla nave scuola si formano gli", "blank": "allievi", "post": "ufficiali dell'Accademia Navale."}, {"pre": "4.  La Marina investe in", "blank": "droni", "post": ", sottomarini e nuove tecnologie."}, {"pre": "5.  È un sapere che si", "blank": "tramanda", "post": "da quasi un secolo."}], "answers": [["1.", "veliero", "«il veliero» = sailing ship, tall ship"], ["2.", "stelle", "«orientarsi con le stelle» = to navigate by the stars"], ["3.", "allievi", "«gli allievi ufficiali» = officer cadets"], ["4.", "droni", "«i droni» = drones (aerei, di superficie e subacquei)"], ["5.", "tramanda", "«si tramanda» = is handed down (si passivante, singolare: il sapere)"]]}, "verofalso": {"items": [{"s": "Il Vespucci è una nave scuola della Marina Militare italiana.", "a": "V", "note": ""}, {"s": "Sul Vespucci non ci sono strumenti moderni: si naviga solo con le stelle.", "a": "F", "note": "A bordo ci sono anche GPS, radar e comunicazioni satellitari; le stelle si studiano in più."}, {"s": "Gli allievi ufficiali imparano a calcolare la posizione della nave osservando il cielo.", "a": "V", "note": ""}, {"s": "Secondo il servizio, la Marina ha deciso di non usare i droni.", "a": "F", "note": "Al contrario: la Marina investe in droni, sottomarini e nuove tecnologie."}, {"s": "Il Vespucci è stato varato nel 1931.", "a": "V", "note": ""}, {"s": "Il servizio dice quanto costa un anno di studi all'Accademia Navale.", "a": "N", "note": "Il servizio non parla dei costi degli studi."}], "key_html": "<b>1.</b> Vero &nbsp; <b>2.</b> Falso (ci sono anche GPS e radar) &nbsp; <b>3.</b> Vero &nbsp; <b>4.</b> Falso (la Marina investe nei droni) &nbsp; <b>5.</b> Vero &nbsp; <b>6.</b> Non detto"}, "discussion": [{"q": "Come ci si orienta in una città nuova, secondo te? Usi sempre il telefono o anche altri metodi?", "m": "Di solito uso il telefono, ma quando si è in una città nuova si impara molto anche camminando senza mappa. Ci si orienta con le piazze, le chiese, il fiume. Secondo me così si ricorda meglio la strada."}, {"q": "Quali saperi o mestieri tradizionali si tramandano ancora nella tua famiglia o nel tuo Paese?", "m": "Nella mia famiglia si tramandano soprattutto le ricette: le torte di mia nonna si fanno ancora a mano, come cinquant'anni fa. Nel mio Paese si conservano anche alcuni mestieri artigianali, ma se ne parla sempre meno."}, {"q": "Secondo te, quali lavori si faranno con le macchine tra vent'anni? E quali si dovranno fare ancora con le persone?", "m": "Penso che molti lavori ripetitivi si faranno con le macchine e con i droni, per esempio i controlli e i trasporti. Ma l'insegnamento, la cura delle persone e le decisioni importanti si dovranno fare ancora con l'esperienza umana."}], "homework": [{"label": "Compiti — Scrittura", "bgCls": "red", "blockCls": "red-b", "h3color": "#E24E3E", "h3text": "✍ Una giornata a bordo (80–100 parole)", "bodyHTML": "Immagina di essere un allievo o un'allieva ufficiale sul Vespucci. Scrivi una breve pagina di diario per spiegare a un amico come si vive a bordo: a che ora ci si alza, che cosa si mangia, come si impara a navigare, che cosa si fa nel tempo libero.<br><br>Usa almeno <b>sei forme con il si</b>: due con il <b>si impersonale</b> (<i>si lavora molto, si va a letto presto</i>), due con il <b>si passivante</b> e il verbo accordato (<i>si studiano le stelle, si puliscono i ponti</i>), una con <b>ci si</b> (<i>ci si abitua</i>) e una in un <b>tempo composto</b> (<i>ieri si è navigato tutto il giorno; si sono viste le coste del Canada</i>).<br><br>Usa anche almeno <b>cinque parole</b> della lezione (per esempio: <i>il veliero, l'equipaggio, a bordo, orientarsi, il mestiere</i>).", "chips": ["80–100 parole", "5 parole nuove", "si impersonale / passivante"]}], "grammar_practice": [{"title": "Che tipo di «si»?", "instr": "Leggi la frase. Il «si» è impersonale (I), passivante (P) o riflessivo/pronominale (R)? Per P indica il soggetto grammaticale.", "items": ["1.  Insegniamo agli allievi come si naviga con le stelle.", "2.  Sul Vespucci si formano gli ufficiali di Marina.", "3.  Il veliero si fa strada lungo un fiume canadese.", "4.  È un sapere che si tramanda da quasi un secolo.", "5.  Se si guarda alla sicurezza europea, il Mediterraneo è un'area «calda».", "6.  La Marina si dota di tecnologie sempre più avanzate.", "7.  Sott'acqua si gioca una parte importante della competizione futura.", "8.  Il comandante continua a insegnare come si va per mare."], "answers": ["1.  I — verbo intransitivo, nessun oggetto (= come la gente naviga)", "2.  P — soggetto: gli ufficiali (verbo plurale = vengono formati)", "3.  R — pronominale: soggetto preciso, il veliero (farsi strada)", "4.  P — soggetto: un sapere (= che viene tramandato)", "5.  I — verbo con preposizione (guardare a), verbo singolare", "6.  R — pronominale: soggetto la Marina (dotarsi di)", "7.  P — soggetto: una parte importante (= viene giocata)", "8.  I — verbo intransitivo andare (= come la gente va per mare)"]}, {"title": "Singolare o plurale?", "instr": "Scegli la forma corretta del verbo o del participio.", "items": ["1.  A bordo si (usa / usano) ancora le carte nautiche di carta.", "2.  Lontano dalla costa si (osserva / osservano) il cielo ogni notte.", "3.  Nell'ultima campagna si sono (percorso / percorse) oltre 16mila miglia.", "4.  Si è (passato / passati) dalla produzione su licenza a un progetto italiano.", "5.  Durante la traversata si è (lavorato / lavorati) giorno e notte.", "6.  Quando si è (giovane / giovani), si accetta volentieri un'avventura in mare.", "7.  Sulle navi moderne si (deve / devono) integrare nuovi droni.", "8.  Dopo qualche settimana (si si / ci si) abitua alla vita a bordo."], "answers": ["1.  usano — si passivante: soggetto «le carte nautiche» (plurale)", "2.  osserva — si passivante: soggetto «il cielo» (singolare)", "3.  percorse — tempo composto del passivante: accordo con «miglia» (femminile plurale)", "4.  passati — si impersonale + verbo che vuole essere: participio in -i", "5.  lavorato — si impersonale + verbo che vuole avere: participio in -o", "6.  giovani — dopo il si impersonale l'aggettivo va al plurale", "7.  devono — il modale si accorda con l'oggetto dell'infinito, «nuovi droni»", "8.  ci si — con un verbo riflessivo (abituarsi) non si dice «si si»"]}, {"title": "Dal passivo al «si»", "instr": "Trasforma la frase con il si passivante o impersonale. Se nella frase c'è l'agente (da + persona), spiega perché la trasformazione non è possibile.", "items": ["1.  Gli allievi vengono addestrati a riconoscere le stelle.", "2.  Le posizioni della nave sono state calcolate a mano.", "3.  Qui la gente vive a stretto contatto con l'equipaggio.", "4.  Il veliero è visitato da migliaia di turisti in ogni porto.", "5.  Le stelle vengono riconosciute anche senza strumenti.", "6.  Di nuove tecnologie la gente parla ogni giorno."], "answers": ["1.  Si addestrano gli allievi a riconoscere le stelle.", "2.  Si sono calcolate a mano le posizioni della nave.", "3.  Qui si vive a stretto contatto con l'equipaggio.", "4.  Impossibile: c'è l'agente («da migliaia di turisti»); con il si passivante l'agente non si esprime. Resta: «Il veliero viene visitato da migliaia di turisti».", "5.  Si riconoscono le stelle anche senza strumenti.", "6.  Di nuove tecnologie se ne parla ogni giorno. (oppure: Si parla di nuove tecnologie ogni giorno.)"]}]};

const UI = {

function makeSlide(label, cls) {
  const div = document.createElement('div');
  div.className = 'slide ' + cls;
  vp.appendChild(div);
  SLIDES.push({ label, el: div });
  if (cls !== 'title-slide' && cls !== 'sep-slide') {
    const bs = document.createElement('div'); bs.className = 'brand-strip';
    const n = document.createElement('span'); n.className = 'bs-name'; n.textContent = 'Goodman';
    const l = document.createElement('span'); l.className = 'bs-lang'; l.textContent = UI.brandLang;
    bs.appendChild(n); bs.appendChild(l); div.appendChild(bs);
  }
  return div;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function ap(parent, ...children) { children.forEach(c => parent.appendChild(c)); return parent; }

// ── BUILD (B1 shape: warm-up → vocab → video → reading → grammar → comprehension → exercises → discussion → homework)
function build() {
  const D = SPEC.dividers || {};
  makeTitle(SPEC.title_slide || {});

  makeDivider(D.warmup);
  makeQuestionsSlide(UI.warmupLabel, UI.warmupH2, UI.warmupSub, UI.warmupBox, SPEC.warmup.questions);
  if (SPEC.warmup.episode) makeProseSlide('Riscaldamento — Di cosa parla?', SPEC.warmup.episode.h2, SPEC.warmup.episode.sub, SPEC.warmup.episode.body);
  if (SPEC.figures) makeFiguresSlide(SPEC.figures);

  makeDivider(D.vocab);
  const per = 2; // rule: 8 cards per slide (2 groups × 4)
  for (let i = 0; i < VOCAB.length; i += per) {
    makeVocabSlide('Parole chiave — ' + (Math.floor(i/per) + 1) + '/' + Math.ceil(VOCAB.length/per), VOCAB.slice(i, i + per));
  }

  if (SPEC.video && SPEC.video.parts && SPEC.video.parts.length) {
    makeDivider(D.video);
    const vid = ytId(SPEC.video.url || SPEC.video.video_id);
    SPEC.video.parts.forEach((p, i) => makeVideoPartSlide(p, i, SPEC.video.parts.length, vid));
  }

  if (SPEC.reading) { makeDivider(D.reading); makeReadingSlide(SPEC.reading); }

  if (SPEC.grammar && SPEC.grammar.length) { makeDivider(D.grammar); SPEC.grammar.forEach(makeGramSlide); }

  makeDivider(D.comprehension);
  (SPEC.comprehension || []).forEach(makeCompSlide);

  makeDivider(D.exercises);
  if (SPEC.gapfill) { makeGapSlide(SPEC.gapfill); makeGapAnswerSlide(SPEC.gapfill); }
  if (SPEC.match) makeMatchSlide(SPEC.match);
  if (SPEC.verofalso) makeVFSlide(SPEC.verofalso);

  makeDivider(D.discussion);
  makeDiscSlide();

  if (SPEC.homework && SPEC.homework.length) { makeDivider(D.homework); SPEC.homework.forEach(makeHWSlide); }
}
build();

const TOTAL = SLIDES.length; let cur = 0;
SLIDES[0].el.classList.add('active');
const DISC_IDX = SLIDES.findIndex(s => s.el.classList.contains('disc-slide'));
function go(d) {
  SLIDES[cur].el.classList.remove('active');
  cur = Math.max(0, Math.min(TOTAL - 1, cur + d));
  SLIDES[cur].el.classList.add('active'); SLIDES[cur].el.scrollTop = 0; updateNav();
  if (cur === DISC_IDX) initMicPermission();
}
function updateNav() {
  document.getElementById('slide-label').textContent = (cur+1) + ' / ' + TOTAL + ' — ' + SLIDES[cur].label;
  document.getElementById('pb').style.width = ((cur+1)/TOTAL*100) + '%';
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === TOTAL-1;
}
updateNav();
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if ((e.key==='r'||e.key==='R') && cur===DISC_IDX) toggleMic();
});

// ── GAP FILL ─────────────────────────────────────────────────────
let selWord = null;
function wireGap() {
  const wb = document.getElementById('wb'); const gs = document.getElementById('gap-sents'); if (!wb || !gs) return;
  [...GAP_WORDS].sort(()=>Math.random()-0.5).forEach(w => {
    const d = el('div','dword', w); d.dataset.w = w;
    d.onclick = () => { if (d.classList.contains('used')) return; document.querySelectorAll('.dword').forEach(x=>x.classList.remove('sel-w')); d.classList.add('sel-w'); selWord = w; };
    wb.appendChild(d);
  });
  GAP_SENTS.forEach(s => { const d = el('div','gap-sentence'); d.innerHTML = s.pre + ' <span class="drop-zone" data-blank="'+s.blank+'" onclick="fillZone(this)">_ _ _ _ _</span> ' + s.post; gs.appendChild(d); });
}
function fillZone(z) {
  if (!selWord || z.classList.contains('ok')) return;
  document.querySelectorAll('.drop-zone').forEach(oz=>{ if(oz!==z && oz.dataset.filled===selWord){oz.textContent='_ _ _ _ _';oz.classList.remove('filled','ok','wrong');oz.dataset.filled='';} });
  z.textContent = selWord; z.classList.add('filled'); z.dataset.filled = selWord;
  document.querySelectorAll('.dword').forEach(d=>d.classList.remove('sel-w')); selWord = null;
}
function checkGap() { document.querySelectorAll('.drop-zone').forEach(z=>{ z.classList.remove('ok','wrong'); if(z.dataset.filled===z.dataset.blank) z.classList.add('ok'); else if(z.dataset.filled) z.classList.add('wrong'); }); }
function resetGap() { document.querySelectorAll('.drop-zone').forEach(z=>{z.textContent='_ _ _ _ _';z.classList.remove('filled','ok','wrong');z.dataset.filled='';}); document.querySelectorAll('.dword').forEach(d=>d.classList.remove('used','sel-w')); selWord = null; }

// ── MATCHING ─────────────────────────────────────────────────────
let selTerm = null;
function wireMatch() {
  const tc = document.getElementById('mterms'), dc = document.getElementById('mdefs'); if (!tc || !dc) return;
  const shuffled = [...MATCH].sort(()=>Math.random()-0.5);
  MATCH.forEach((m,i)=>{ const e2 = el('div','mitem', m.t); e2.dataset.pair = i; e2.dataset.side='t';
    e2.onclick = () => { if (e2.classList.contains('matched')) return; document.querySelectorAll('.mitem[data-side="t"]').forEach(x=>x.classList.remove('sel')); e2.classList.add('sel'); selTerm = e2; };
    tc.appendChild(e2); });
  shuffled.forEach(m=>{ const oi = MATCH.findIndex(x=>x.d===m.d); const e2 = el('div','mitem', m.d); e2.dataset.pair = oi; e2.dataset.side='d';
    e2.onclick = () => { if (!selTerm || e2.classList.contains('matched')) return;
      if (selTerm.dataset.pair === e2.dataset.pair) { selTerm.classList.remove('sel'); selTerm.classList.add('matched'); e2.classList.add('matched'); selTerm = null; }
      else { e2.classList.add('bad'); setTimeout(()=>e2.classList.remove('bad'),500); const st = selTerm; selTerm = null; st.classList.add('bad'); setTimeout(()=>st.classList.remove('bad','sel'),500); } };
    dc.appendChild(e2); });
}

// ── VERO / FALSO / NON DETTO ──────────────────────────────────
function wireVF() {
  const root = document.getElementById('vf-root'); if (!root) return;
  VF.forEach((item,i)=>{
    const row = el('div','vf-row'); const btns = el('div','vf-btns');
    UI.vfBtns.forEach(([cls,val])=>{ const b = el('button','vfb '+cls, val); b.onclick = () => checkVF(b, cls, item.a, i); btns.appendChild(b); });
    const body = document.createElement('div'); body.style.flex='1';
    body.appendChild(el('div','', String(i+1)+'. '+item.s));
    if (item.note) { const n = el('div','vf-note','→ '+item.note); n.id='vfn'+i; body.appendChild(n); }
    ap(row, btns, body); root.appendChild(row);
  });
}
function checkVF(btn, chosen, correct, idx) {
  btn.closest('.vf-row').querySelectorAll('.vfb').forEach(b=>b.classList.remove('correct','incorrect'));
  if (chosen===correct) btn.classList.add('correct');
  else { btn.classList.add('incorrect'); const n=document.getElementById('vfn'+idx); if(n) n.classList.add('show'); }
}

// ── DISCUSSION + MIC ─────────────────────────────────────────────
let dIdx=0, recog=null, recording=false, micOK=false, micStream=null;
function wireDisc() {
  const dots = document.getElementById('ddots'); if (!dots) return;
  DISC.forEach((_,i)=>{ const d = el('div','disc-dot'+(i===0?' active':'')); d.onclick = () => gotoDisc(i); dots.appendChild(d); });
  loadDisc();
}
function loadDisc() {
  const dq = document.getElementById('dq'); if (!dq) return;
  dq.textContent = DISC[dIdx].q;
  document.getElementById('dqnum').textContent = (dIdx+1) + '. ' + UI.question + UI.ofN + DISC.length;
  document.getElementById('dmtext').textContent = DISC[dIdx].m;
  document.getElementById('dmbox').classList.add('blur');
  if (!recording) { const ub = document.getElementById('dubox'); ub.innerHTML=''; ub.appendChild(el('span','ph', UI.micPh)); ub.classList.remove('listening'); }
  document.querySelectorAll('.disc-dot').forEach((d,i)=>d.classList.toggle('active', i===dIdx));
  const pb = document.getElementById('dprev'), nb = document.getElementById('dnext');
  if (pb) pb.disabled = dIdx === 0;
  if (nb) { const last = dIdx >= DISC.length - 1; nb.textContent = last ? UI.nextSlide : UI.next; nb.classList.toggle('to-slide', last); }
}
function dNav(d) { document.querySelectorAll('.disc-dot')[dIdx].classList.add('done'); dIdx = Math.max(0, Math.min(DISC.length-1, dIdx+d)); loadDisc(); }
function gotoDisc(i){ dIdx=i; loadDisc(); }
function revealModel(){ document.getElementById('dmbox').classList.toggle('blur'); }
function initMicPermission() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; return; }
  if (micOK && micStream && micStream.active) return;
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => { micStream = stream; micOK = true; const st = document.getElementById('micstat'); if (st) st.textContent = UI.micReady; })
      .catch(e => { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) { const w=document.getElementById('swarn'); if(w) w.style.display='block'; } });
  }
}
function toggleMic(){ recording ? stopMic() : startMic(); }
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  recog = new SR(); recog.lang='it-IT'; recog.continuous=true; recog.interimResults=true;
  const box = document.getElementById('dubox'); box.innerHTML=''; box.classList.add('listening');
  let final='';
  recog.onresult = e => { let interim=''; for (let i=e.resultIndex; i<e.results.length; i++) { if (e.results[i].isFinal) final += e.results[i][0].transcript + ' '; else interim += e.results[i][0].transcript; } box.textContent = final + interim; micOK = true; };
  recog.onerror = e => { if (e.error!=='no-speech') stopMic(); };
  recog.onend = () => { if (recording) recog.start(); };
  recog.start(); recording = true;
  document.getElementById('micbtn').classList.add('on'); document.getElementById('micbtn').textContent = '⏹';
  document.getElementById('micstat').textContent = UI.micRec;
}
function stopMic() {
  if (recog) { recog.stop(); recog=null; } recording=false;
  document.getElementById('micbtn').classList.remove('on'); document.getElementById('micbtn').textContent = '🎤';
  document.getElementById('micstat').textContent = UI.micPause; document.getElementById('dubox').classList.remove('listening');
}
function toggleAK(id){ document.getElementById(id).classList.toggle('show'); }

wireGap(); wireMatch(); wireVF(); wireDisc();

// ── Text-size control ────────────────────────────────────────────
(function(){
  let z = 100;
  const bar = document.createElement('div'); bar.id='tsize';
  bar.innerHTML = '<span>' + UI.tsize + '</span><button id="tsm">A−</button><span id="tsv">100%</span><button id="tsp">A+</button><button id="tsr">⟲</button>';
  const _tb=document.getElementById('topbar'), _nb=document.getElementById('nav-btns');
  if(_tb && _nb) _tb.insertBefore(bar, _nb); else document.body.appendChild(bar);
  function apply(){ document.getElementById('viewport').style.zoom = (z/100); document.getElementById('tsv').textContent = z+'%'; }
  document.getElementById('tsm').onclick = ()=>{ z=Math.max(70,z-10); apply(); };
  document.getElementById('tsp').onclick = ()=>{ z=Math.min(220,z+10); apply(); };
  document.getElementById('tsr').onclick = ()=>{ z=100; apply(); };
})();
</script>
